<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyldetjek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#F6F7F4;
  --card:#FFFFFF;
  --ink:#1E2A36;
  --ink-2:#4A5763;
  --ink-3:#7C8792;
  --rule:#D9DED8;
  --rule-2:#EDEFEA;
  --green:#2F6B4F;
  --green-2:#E4F0EA;
  --green-3:#1F4D38;
  --amber:#B9861E;
  --amber-2:#FBF1DC;
  --red:#A63D2F;
  --red-2:#F8E5E1;
  --focus:#2F6B4F;
  --radius:10px;
  --radius-s:6px;
  --shadow:0 1px 2px rgba(30,42,54,.06), 0 4px 16px rgba(30,42,54,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151A1F; --card:#1E252C; --ink:#EDEFEA; --ink-2:#B9C1C8; --ink-3:#7F8A94;
    --rule:#334049; --rule-2:#28323A;
    --green:#6FB58F; --green-2:#213A2E; --green-3:#9AD1B3;
    --amber:#E0B25A; --amber-2:#3A3120;
    --red:#E08B7D; --red-2:#402420;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    --paper:#151A1F; --card:#1E252C; --ink:#EDEFEA; --ink-2:#B9C1C8; --ink-3:#7F8A94;
    --rule:#334049; --rule-2:#28323A;
    --green:#6FB58F; --green-2:#213A2E; --green-3:#9AD1B3;
    --amber:#E0B25A; --amber-2:#3A3120;
    --red:#E08B7D; --red-2:#402420;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{font-size:16px}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:var(--green)}
button{font:inherit; color:inherit}
h1,h2,h3{margin:0; font-weight:700; line-height:1.2}
h1{font-size:1.9rem; letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.hidden{display:none !important}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}

.wrap{max-width:1120px; margin:0 auto; padding:0 20px}

/* ---------- top bar ---------- */
.top{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:18px 0 14px; border-bottom:1px solid var(--rule);
}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); background:none; border:0; padding:0; cursor:pointer}
.brand svg{width:28px; height:28px; display:block}
.brand b{font-size:1.15rem; letter-spacing:-.01em}
.brand .ver{font-size:.75rem; color:var(--ink-3); margin-left:2px; align-self:flex-end; padding-bottom:3px}
.top .file{display:flex; align-items:center; gap:12px; font-size:.9rem; color:var(--ink-2); min-width:0}
.top .file .btn{white-space:nowrap}
@media (max-width:600px){ .top .file > span:not(.name){display:none} }
.top .file .name{font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 16px;
  border-radius:var(--radius-s); border:1px solid var(--rule); background:var(--card);
  cursor:pointer; font-weight:700; line-height:1.2; transition:background .12s, border-color .12s;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--green); border-color:var(--green); color:#fff}
.btn.primary:hover{background:var(--green-3); border-color:var(--green-3)}
.btn.quiet{background:transparent; border-color:transparent; color:var(--green); padding:6px 8px}
.btn.quiet:hover{background:var(--green-2); border-color:transparent}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn svg{width:18px; height:18px}

/* ---------- home ---------- */
.hero{padding:56px 0 28px; max-width:640px}
.hero h1{text-wrap:balance}
.hero p{margin-top:10px; font-size:1.1rem; color:var(--ink-2)}

.drop{ display:block;
  margin:8px 0 40px; padding:36px 28px; text-align:center;
  border:2px dashed var(--rule); border-radius:var(--radius); background:var(--card);
  cursor:pointer; transition:border-color .12s, background .12s;
}
.drop:hover, .drop.over{border-color:var(--green); background:var(--green-2)}
.loaded.over{border-color:var(--green); background:var(--green-2)}
.drop strong{font-size:1.1rem}
.drop .sub{margin-top:6px; color:var(--ink-2)}
.drop .sub2{margin-top:14px; font-size:.85rem; color:var(--ink-3)}
.drop input{display:none}

.loaded{
  margin:8px 0 40px; padding:20px 24px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  border-radius:var(--radius); background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow);
}
.loaded .ok{width:38px; height:38px; border-radius:50%; background:var(--green-2); color:var(--green); display:grid; place-items:center; flex:none}
.loaded .ok svg{width:20px;height:20px}
.loaded .facts{flex:1; min-width:220px}
.loaded .facts b{display:block; font-size:1.05rem}
.loaded .facts span{color:var(--ink-2)}
.loaded .acts{display:flex; gap:8px; flex-wrap:wrap}
.loaded .filelist{flex-basis:100%; display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.8rem; color:var(--ink-3); border-top:1px solid var(--rule-2); padding-top:10px; margin-top:2px}
.loaded .filelist:empty{display:none}
.warn{margin:0 0 32px; padding:12px 16px; border-radius:var(--radius-s); background:var(--amber-2); color:var(--ink); border-left:4px solid var(--amber); font-size:.925rem}
.err{margin:0 0 32px; padding:12px 16px; border-radius:var(--radius-s); background:var(--red-2); border-left:4px solid var(--red); font-size:.925rem}

.fns{list-style:none; margin:0 0 64px; padding:0; border-top:1px solid var(--rule)}
.fns li{border-bottom:1px solid var(--rule)}
.fn{
  width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center;
  padding:22px 8px; background:none; border:0; text-align:left; cursor:pointer; border-radius:4px;
}
.fn:hover:not(:disabled){background:var(--card)}
.fn:disabled{cursor:default}
.fn:disabled .ico,.fn:disabled .t,.fn:disabled .d{opacity:.45}
.fn .ico{width:44px; height:44px; border-radius:var(--radius-s); background:var(--green-2); color:var(--green); display:grid; place-items:center}
.fn .ico svg{width:24px; height:24px}
.fn .t{font-size:1.15rem; font-weight:700}
.fn .d{color:var(--ink-2); margin-top:2px}
.fn .go{color:var(--green); font-weight:700; white-space:nowrap}
.fn:disabled .go{visibility:hidden}

.mapping{margin:0 0 40px; padding:20px 24px; border-radius:var(--radius); background:var(--card); border:1px solid var(--rule)}
.mapping h3{margin-bottom:6px}
.mapping .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px 20px; margin-top:14px}
.mapping label{display:flex; flex-direction:column; gap:4px; font-size:.9rem}
.mapping select{padding:8px; border-radius:var(--radius-s); border:1px solid var(--rule); background:var(--paper); color:var(--ink); font:inherit}

/* ---------- tool ---------- */
.toolhead{padding:22px 0 18px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap}
.toolhead .back{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2); text-decoration:none; background:none; border:0; padding:0; cursor:pointer; font-size:.925rem; margin-bottom:8px}
.toolhead .back:hover{color:var(--green)}
.toolhead .back svg{width:16px;height:16px}
.toolhead .explain{color:var(--ink-2); max-width:60ch; margin-top:4px}

.tool{display:grid; grid-template-columns:340px minmax(0,1fr); gap:28px; align-items:start; padding-bottom:64px}
@media (max-width:860px){.tool{grid-template-columns:1fr}}

.panel{background:var(--card); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow)}
.panel .sec{padding:16px 18px; border-bottom:1px solid var(--rule-2)}
.panel .sec:last-child{border-bottom:0}
.panel .sec h3{display:flex; align-items:center; justify-content:space-between; font-size:.95rem}
.panel .sec h3 .hint{font-weight:400; color:var(--ink-3); font-size:.8rem}
.panel .sec .body{margin-top:10px}
.panel details.sec summary{cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:.95rem}
.panel details.sec summary::-webkit-details-marker{display:none}
.panel details.sec summary .chev{transition:transform .15s; color:var(--ink-3)}
.panel details.sec[open] summary .chev{transform:rotate(90deg)}
.panel details.sec summary .cnt{font-weight:400; color:var(--green); font-size:.85rem}
.panel .run{padding:16px 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.panel .run .btn.primary{flex:1; justify-content:center}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 10px 5px 8px; border-radius:999px;
  border:1px solid var(--rule); background:var(--paper); cursor:pointer; font-size:.875rem; user-select:none;
}
.chip input{margin:0; accent-color:var(--green)}
.chip .n{color:var(--ink-3); font-size:.78rem}
.chip.on{background:var(--green-2); border-color:var(--green); color:var(--green-3)}
.chip.on .n{color:var(--green)}
.chips-tools{display:flex; gap:12px; margin-top:8px; font-size:.8rem}
.chipbox.collapsed .chip.hid{display:none}
.chipbox.collapsed .chips-filter{display:none}
.chipbox.collapsed .when-open{display:none}
.chipbox:not(.collapsed) .when-closed{display:none}
.chipbox{display:flex; flex-direction:column}
.chipbox .chips-filter{order:1} .chipbox .chips{order:2} .chipbox .chips-tools{order:3}
.chipbox .cb-toggle{order:4; align-self:flex-start; background:none; border:0; padding:0; margin-top:8px; color:var(--green); cursor:pointer; font-weight:700; font-size:.8rem}
.chipbox.collapsed .chips-tools:empty{display:none}
.chips .when-closed{align-self:center; padding:5px 0}
.lvlrow{display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--rule-2)}
.lvlrow:last-child{border-bottom:0}
.lvlrow > b{font-size:.875rem; color:var(--ink-2); grid-column:1; grid-row:1}
.lvlrow .chipbox{display:contents}
.lvlrow .chipbox .cb-toggle{grid-column:2; grid-row:1; margin:0}
.lvlrow .chipbox .chips-filter{grid-column:1/-1}
.lvlrow .chipbox .chips{grid-column:1/-1}
.lvlrow .chipbox .chips:empty{display:none}
.lvlrow .chipbox.collapsed .chips-tools{display:none}
.lvlrow .chipbox .chips-tools{grid-column:1/-1; margin:0}
.panel details.sec summary .chev svg{width:16px;height:16px;display:block}
details.base{margin:-28px 0 36px; background:var(--card); border:1px solid var(--rule); border-radius:var(--radius); padding:0 20px}
details.base summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:14px 0; font-weight:700}
details.base summary::-webkit-details-marker{display:none}
details.base summary .hint{font-weight:400; color:var(--green); font-size:.875rem; flex:1}
details.base summary .chev{color:var(--ink-3); transition:transform .15s}
details.base summary .chev svg{width:16px;height:16px}
details.base[open] summary .chev{transform:rotate(90deg)}
details.base .body{padding:4px 0 18px; border-top:1px solid var(--rule-2)}
details.base .body > p{margin:12px 0 14px}
.chips-tools button{background:none; border:0; padding:0; color:var(--green); cursor:pointer; font-weight:700}
.chips-filter{width:100%; padding:7px 10px; margin-bottom:8px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--paper); color:var(--ink); font:inherit; font-size:.875rem}
.fieldrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.fieldrow select,.fieldrow input[type=text],.fieldrow input[type=number]{
  padding:7px 10px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--paper); color:var(--ink); font:inherit; font-size:.9rem;
}
.fieldrow input[type=number]{width:74px}
.fieldrow label{font-size:.9rem}
.levelgrid{display:grid; grid-template-columns:1fr; gap:14px}
.levelgrid .lvl b{display:block; font-size:.85rem; margin-bottom:6px; color:var(--ink-2)}
.side{padding:12px; border:1px solid var(--rule); border-radius:var(--radius-s); margin-bottom:10px; background:var(--paper)}
.side .lbl{font-weight:700; font-size:.9rem; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between}
.side .lbl .opt{font-weight:400; color:var(--ink-3); font-size:.8rem}
.side .chips .chip{background:var(--card)}
.radio{display:flex; gap:14px; flex-wrap:wrap; font-size:.9rem}
.radio label{display:flex; align-items:center; gap:6px; cursor:pointer}
.radio input{accent-color:var(--green)}

/* ---------- results ---------- */
.results{min-height:200px}
.results .empty{padding:48px 24px; text-align:center; color:var(--ink-2); border:1px dashed var(--rule); border-radius:var(--radius)}
.results .empty b{display:block; color:var(--ink); margin-bottom:4px; font-size:1.05rem}
.rhead{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:0 0 12px}
.rhead .sum b{font-size:1.15rem}
.rhead .sum span{color:var(--ink-2)}
.rhead .acts{display:flex; gap:8px; flex-wrap:wrap}
.rtools{display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:.85rem; padding:8px 0 10px; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule)}
.rtools button{background:none;border:0;padding:0;color:var(--green);cursor:pointer;font-weight:700}
.rtools .sort{margin-left:auto; display:flex; gap:6px; align-items:center; color:var(--ink-2)}
.rtools .sort select{padding:4px 6px; border:1px solid var(--rule); border-radius:4px; background:var(--card); color:var(--ink); font:inherit; font-size:.85rem}

.grp{border-bottom:1px solid var(--rule)}
.grp .row{display:grid; grid-template-columns:auto auto 1fr auto; gap:12px; align-items:center; padding:12px 6px; cursor:pointer}
.grp .row:hover{background:var(--card)}
.grp .row .tog{width:22px;height:22px;display:grid;place-items:center;color:var(--ink-3);border:0;background:none;padding:0}
.grp .row .tog svg{width:14px;height:14px;transition:transform .15s}
.grp.open .row .tog svg{transform:rotate(90deg)}
.grp .row input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--green);cursor:pointer}
.grp .main{min-width:0}
.grp .main .ttl{font-weight:700}
.grp .main .aut{color:var(--ink-2)}
.grp .main .meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; font-size:.8rem}
.badge{display:inline-flex; align-items:center; padding:1px 8px; border-radius:999px; background:var(--rule-2); color:var(--ink-2); white-space:nowrap}
.badge.amber{background:var(--amber-2); color:var(--amber)}
.badge.green{background:var(--green-2); color:var(--green-3)}
.grp .cnt{font-weight:700; font-size:1.2rem; text-align:right; min-width:2.2em}
.grp .cnt small{display:block; font-weight:400; font-size:.72rem; color:var(--ink-3); line-height:1}
.grp .items{display:none; padding:0 6px 12px 46px}
.grp.open .items{display:block}
.items table{width:100%; border-collapse:collapse; font-size:.875rem}
.items th{text-align:left; font-weight:400; color:var(--ink-3); padding:4px 8px 6px 0; border-bottom:1px solid var(--rule-2); font-size:.78rem}
.items td{padding:6px 8px 6px 0; border-bottom:1px solid var(--rule-2); vertical-align:top}
.items tr:last-child td{border-bottom:0}
.items td.chk{width:26px}
.items td.chk input{accent-color:var(--green); margin:0; width:16px; height:16px}
.items td.nr{font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink-2)}
.items td.st .badge{font-size:.78rem}
.items tr.dim td{color:var(--ink-3)}
.items tr.dim td.chk{visibility:hidden}
.items .ed{color:var(--ink-3); font-style:italic}
.tblwrap{overflow-x:auto}
.more{padding:14px 0 30px; text-align:center}

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:var(--radius-s); font-size:.9rem; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s}
.toast.show{opacity:1}

/* presets */
.presets{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.presets select{flex:1 0 100%; min-width:120px; padding:7px 10px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--paper); color:var(--ink); font:inherit; font-size:.9rem}
.presets .btn{padding:7px 10px; font-size:.85rem; flex:1; justify-content:center}
.saveform{margin-top:10px; padding:12px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--paper); display:flex; flex-direction:column; gap:10px}
.saveform input[type=text]{padding:8px 10px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--card); color:var(--ink); font:inherit; font-size:.9rem}
.saveform .chip{background:var(--card)}
.saveform .saveacts{display:flex; gap:8px} .saveform .saveacts .btn{padding:7px 12px; font-size:.85rem}
.run .btn.quiet{flex:0}
.favs{display:flex; flex-wrap:wrap; gap:6px; padding:0 8px 16px 70px; margin-top:-8px}
.fav{display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 9px; border-radius:999px; border:1px solid var(--rule); background:var(--card); font-size:.875rem; font-weight:700; color:var(--ink); cursor:pointer}
.fav:hover{border-color:var(--green); background:var(--green-2); color:var(--green-3)}
.fav svg{width:14px;height:14px;color:var(--amber)}
@media (max-width:600px){.favs{padding-left:8px}}

@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

/* ---------- print (hyldeliste) ---------- */
#print{display:none}
@media print{
  body{background:#fff; color:#000}
  #app{display:none !important}
  #print{display:block; font-size:10.5pt}
  #print h1{font-size:16pt; margin:0 0 2pt}
  #print .pm{font-size:9pt; color:#444; margin-bottom:12pt}
  #print h2{font-size:12pt; margin:14pt 0 4pt; border-bottom:1.5px solid #000; padding-bottom:2pt; break-after:avoid}
  #print table{width:100%; border-collapse:collapse}
  #print th{text-align:left; font-size:8.5pt; color:#444; font-weight:400; border-bottom:1px solid #999; padding:2pt 4pt}
  #print td{padding:3pt 4pt; border-bottom:1px solid #ddd; vertical-align:top}
  #print td.nr{white-space:nowrap; font-variant-numeric:tabular-nums}
  #print td.bx{width:14pt}
  #print td.bx span{display:inline-block; width:9pt; height:9pt; border:1px solid #000}
  #print tr{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* ===================================================================
   Hyldetjek 1.4.1 (7. sept. 2026) — klientside-værktøj til hyldearbejde ud fra en
   materialeeksport fra Cicero. Alt sker i browseren; intet sendes.
   Versioner:
   1.0.0  første udgave: tre funktioner, hyldeliste, CSV til Cicero, gemte indstillinger
   1.1.0  grundopsætning (fravælg steder én gang for alle), "Søg i"-afsnit med
          filial/afdeling/sektion/opstilling/delopstilling, statusser foldet sammen
          med Hjemme som standard, femte placeringsniveau navngivet, versionsnummer i toppen
   1.2.0  niveaunavne rettet til Ciceros model (Filial/Afdeling/Opstilling/Delopstilling) og
          kan rettes af brugeren i Grundopsætningen; flere CSV-filer kan læses ind på én gang
          (lægges sammen, dubletter på materialenummer fjernes)
   1.3.0  niveaunavne er faste igen (Ciceros fem, Sektion kun ved fem led; blandede filer får
          tom Sektion indsat); vælg/fravælg alle pr. niveau i Grundopsætningen; "Tilføj filer"
          og "Start forfra" i stedet for "Vælg en anden fil", filliste på forsiden; Skjul-knappen
          bliver på Vælg-knappens plads
   1.4.0  Nulstil-knap i funktionerne; gemte indstillinger kan markeres som favorit og vises
          som genveje under funktionen på forsiden (åbner og kører med det samme); Gem sker i
          en lille linje i panelet i stedet for en dialogboks
   1.4.1  overskriften "Tæl inden for samme…" i ét stykke
   =================================================================== */

const VERSION = '1.4.1';
/* ---------------- kolonner ---------------- */
const ROLES = [
  { id:'plac',   label:'Placering',      req:true,  aliases:['placering','opstilling','lokation','location'] },
  { id:'titel',  label:'Titel',          req:true,  aliases:['titel','title'] },
  { id:'nr',     label:'Materialenr.',   req:true,  aliases:['materialenr','materialenummer','stregkode','barcode','itemid'] },
  { id:'status', label:'Status',         req:true,  aliases:['status'] },
  { id:'forf',   label:'Forfatter',      req:false, aliases:['forfatter','author','ophav'] },
  { id:'type',   label:'Mat. type',      req:false, aliases:['mattype','materialetype','type'] },
  { id:'gruppe', label:'Materialegruppe',req:false, aliases:['materialegruppe','matgruppe','gruppe'] },
  { id:'klass',  label:'Klassifikation', req:false, aliases:['klassifikation','dk5','klasse','classification'] },
];
function normHeader(h){ return String(h||'').toLowerCase().replace(/[^a-zæøå0-9]/g,''); }
function autoMap(headers){
  const map = {}; const used = new Set();
  for (const r of ROLES){
    for (const h of headers){
      if (used.has(h)) continue;
      const n = normHeader(h);
      if (!n) continue;
      if (r.aliases.some(a => n === a || n.startsWith(a))){ map[r.id] = h; used.add(h); break; }
    }
  }
  return map;
}

/* ---------------- tekst ---------------- */
function norm(s){ return String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim(); }
function titleCase0(s){ return String(s||'').trim(); }

// Finder bindangivelser i hele titlen, uanset notation:
// "Bind 3", "1. bind", "[Bind] 1", "[7. bind]", "5. bog", "2. [bog]", "Del 2", "1. del", "Bog 2", "1. bind, del 1", "nr. 4"
const VOL_WORDS = '(?:bind|bd|bog|del|vol|volume|part|book|nr|no)';
const RE_NUM_WORD = new RegExp('\\[?\\s*(\\d{1,4})\\s*\\.?\\s*\\]?\\s*\\.?\\s*\\[?\\s*\\b' + VOL_WORDS + '\\b\\.?\\s*\\]?', 'gi');
const RE_WORD_NUM = new RegExp('\\[?\\s*\\b' + VOL_WORDS + '\\b\\.?\\s*\\]?\\s*\\.?\\s*\\[?\\s*(\\d{1,4})\\s*\\]?', 'gi');
const RE_YEAR = /\((\d{4})\b/;

function titleKey(title){
  const t = String(title||'').trim();
  const stem = t.split(':')[0].trim();
  const marks = []; const nums = [];
  const seen = new Set();
  let m;
  RE_NUM_WORD.lastIndex = 0;
  while ((m = RE_NUM_WORD.exec(t))){ const k = m.index; if (!seen.has(k)){ seen.add(k); marks.push({i:k, txt:m[0].trim(), n:+m[1]}); } }
  RE_WORD_NUM.lastIndex = 0;
  while ((m = RE_WORD_NUM.exec(t))){
    // spring over hvis den overlapper et allerede fundet num-word
    const k = m.index; const end = k + m[0].length;
    if ([...marks].some(x => k < x.i + x.txt.length + 1 && end > x.i)) continue;
    marks.push({i:k, txt:m[0].trim(), n:+m[1]});
  }
  marks.sort((a,b)=>a.i-b.i);
  for (const x of marks) nums.push(x.n);
  const y = RE_YEAR.exec(t);
  const year = y ? +y[1] : null;
  const key = norm(stem).replace(/[.,;!?]+$/,'') + (nums.length ? '#' + nums.join('.') : '') + (year ? '@' + year : '');
  return { key, stem, marks: marks.map(x=>x.txt.replace(/[\[\]]/g,'').trim()), nums, year };
}

/* ---------------- model ---------------- */
const LEVEL_NAME_SETS = { 1:['Placering'], 2:['Filial','Opstilling'], 3:['Filial','Afdeling','Opstilling'], 4:['Filial','Afdeling','Opstilling','Delopstilling'], 5:['Filial','Afdeling','Sektion','Opstilling','Delopstilling'] };
function defaultLevelNames(maxLv){ return LEVEL_NAME_SETS[maxLv] ? LEVEL_NAME_SETS[maxLv].slice() : Array.from({length:maxLv},(_,i)=>'Niveau '+(i+1)); }
function parseRecs(rows, map){
  const recs = []; let maxLv = 1;
  for (const r of rows){
    const plac = titleCase0(r[map.plac]);
    if (!plac && !r[map.titel] && !r[map.nr]) continue; // tom linje
    const parts = plac.split('/').map(s=>s.trim());
    if (parts.length > maxLv) maxLv = parts.length;
    const tk = titleKey(r[map.titel]);
    const forf = titleCase0(map.forf ? r[map.forf] : '');
    recs.push({
      id: recs.length,
      plac, lv: parts,
      titel: titleCase0(r[map.titel]),
      nr: titleCase0(r[map.nr]),
      status: titleCase0(r[map.status]),
      forf,
      type: titleCase0(map.type ? r[map.type] : ''),
      gruppe: titleCase0(map.gruppe ? r[map.gruppe] : ''),
      klass: titleCase0(map.klass ? r[map.klass] : ''),
      tkey: tk.key, stem: tk.stem, marks: tk.marks,
      akey: norm(forf).replace(/[.,;]+$/,''),
    });
  }
  for (const x of recs){
    if (maxLv === 5 && x.lv.length === 4) x.lv.splice(2, 0, '');   // Sektion mangler → tom sektion, ikke tom delopstilling
    while (x.lv.length < maxLv) x.lv.push('');
  }
  return { recs, maxLv };
}
function modelFrom(recs, maxLv, hasForf){
  const levelNames = defaultLevelNames(maxLv);
  const fields = {};
  const count = (getter) => { const m = new Map(); for (const x of recs){ const v = getter(x); m.set(v, (m.get(v)||0)+1); } return [...m.entries()].sort((a,b)=> b[1]-a[1] || String(a[0]).localeCompare(String(b[0]),'da')); };
  for (let i=0;i<maxLv;i++) fields['lv'+i] = { label: levelNames[i], values: count(x=>x.lv[i]) };
  fields.status = { label:'Status', values: count(x=>x.status) };
  fields.type   = { label:'Mat. type', values: count(x=>x.type) };
  fields.gruppe = { label:'Materialegruppe', values: count(x=>x.gruppe) };
  fields.klass  = { label:'Klassifikation', values: count(x=>x.klass) };
  return { recs, maxLv, levelNames, fields, hasForf };
}
function buildModel(rows, map){ const r = parseRecs(rows, map); return modelFrom(r.recs, r.maxLv, !!map.forf); }
function val(x, field){ return field.startsWith('lv') ? x.lv[+field.slice(2)] : x[field]; }

/* ---------------- filtre ---------------- */
// filters: { lv0:[...], lv1:[...], type:[...], gruppe:[...], klass:{mode:'is'|'starts'|'contains', text:''} }
function applyFilters(recs, filters){
  const fl = [];
  for (const [f, v] of Object.entries(filters||{})){
    if (f === 'klass'){
      const t = norm(v && v.text); if (!t) continue;
      const mode = (v.mode||'is');
      fl.push(x => { const k = norm(x.klass); return mode==='is' ? k===t : mode==='starts' ? k.startsWith(t) : k.includes(t); });
    } else if (Array.isArray(v) && v.length){
      const set = new Set(v); fl.push(x => set.has(val(x,f)));
    }
  }
  if (!fl.length) return recs;
  return recs.filter(x => fl.every(fn => fn(x)));
}
function groupBy(recs, groupLevels, useForf){
  const m = new Map();
  for (const x of recs){
    let k = (useForf ? x.akey : '') + '|' + x.tkey;
    for (const l of (groupLevels||[])) k += '|' + x.lv[l];
    let g = m.get(k); if (!g){ g = { k, items:[] }; m.set(k,g); }
    g.items.push(x);
  }
  return [...m.values()];
}
function inSide(x, side){ if (!side || !side.field || !side.values || !side.values.length) return false; return side.values.includes(val(x, side.field)); }
function sideDefined(side){ return !!(side && side.field && side.values && side.values.length); }

/* ---------------- funktioner ---------------- */
// Hver funktion returnerer grupper: { k, items:[...alle i gruppen], hits:[...de der tæller], exp:[...de der eksporteres] }
const FUNCTIONS = {
  flere: {
    title:'Flere eksemplarer',
    short:'Titler med mindst et bestemt antal hjemme. Til udstillingsstakke, tripletter og dubletter.',
    explain:'Finder titler, hvor mindst det valgte antal eksemplarer har en af de valgte statusser. Vælg om der tælles på tværs af hele samlingen eller inden for én placering.',
    defaults:(model)=>({ min:3, statuses: pickDefault(model,'status',['Hjemme']), groupLevels:[], useForf:true, filters:{ type: pickDefault(model,'type',['Bog']) } }),
    run(model, s){
      const base = applyFilters(model.recs, s.filters);
      const st = new Set(s.statuses||[]);
      const out = [];
      for (const g of groupBy(base, s.groupLevels, s.useForf)){
        const hits = g.items.filter(x => st.has(x.status));
        if (hits.length >= (s.min||2)) out.push({ ...g, hits, exp: hits });
      }
      return out;
    },
  },
  ogsaa: {
    title:'Hjemme her, og også dér',
    short:'Titler der står hjemme to steder på én gang. Til kvik-hylden.',
    explain:'Finder titler, hvor mindst ét eksemplar er hjemme i det første sted og mindst ét er hjemme i det andet. Eksporterer som udgangspunkt kun eksemplarerne fra det første sted.',
    defaults:(model)=>({ statuses: pickDefault(model,'status',['Hjemme']), groupLevels:[], useForf:true, sideA:{field:'',values:[]}, sideB:{field:'',values:[]}, exportWhat:'A', filters:{ type: pickDefault(model,'type',['Bog']) } }),
    run(model, s){
      if (!sideDefined(s.sideA) || !sideDefined(s.sideB)) return { error:'Vælg begge steder.' };
      const base = applyFilters(model.recs, s.filters);
      const st = new Set(s.statuses||[]);
      const out = [];
      for (const g of groupBy(base, s.groupLevels, s.useForf)){
        const a = g.items.filter(x => st.has(x.status) && inSide(x, s.sideA));
        const b = g.items.filter(x => st.has(x.status) && inSide(x, s.sideB));
        if (a.length && b.length){
          const hits = [...a, ...b.filter(x=>!a.includes(x))];
          out.push({ ...g, hits, exp: s.exportWhat==='AB' ? hits : a });
        }
      }
      return out;
    },
  },
  ikke: {
    title:'Hjemme her, men ikke dér',
    short:'Titler der kun står hjemme ét sted. Til magasinet.',
    explain:'Finder titler, hvor mindst ét eksemplar er hjemme i det valgte sted, og ingen eksemplarer er hjemme andre steder. Kan afgrænses til titler, som også hører til et bestemt andet sted.',
    defaults:(model)=>({ statuses: pickDefault(model,'status',['Hjemme']), groupLevels:[], useForf:true, sideA:{field:'',values:[]}, sideB:{field:'',values:[]}, exportWhat:'A', filters:{ type: pickDefault(model,'type',['Bog']) } }),
    run(model, s){
      if (!sideDefined(s.sideA)) return { error:'Vælg stedet, der skal være hjemme.' };
      const base = applyFilters(model.recs, s.filters);
      const st = new Set(s.statuses||[]);
      const useB = sideDefined(s.sideB);
      const out = [];
      for (const g of groupBy(base, s.groupLevels, s.useForf)){
        const a = g.items.filter(x => st.has(x.status) && inSide(x, s.sideA));
        if (!a.length) continue;
        const homeElsewhere = g.items.some(x => st.has(x.status) && !inSide(x, s.sideA));
        if (homeElsewhere) continue;
        if (useB && !g.items.some(x => inSide(x, s.sideB))) continue;
        out.push({ ...g, hits:a, exp: s.exportWhat==='AB' ? g.items.slice() : a });
      }
      return out;
    },
  },
};
function pickDefault(model, field, wanted){
  const have = new Set((model.fields[field]||{values:[]}).values.map(v=>v[0]));
  return wanted.filter(w => have.has(w));
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function store(k,v){ try{ localStorage.setItem('hyldetjek:'+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v=localStorage.getItem('hyldetjek:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }

/* ---------- fil ---------- */
function readFile(file){ readFiles([file]); }
function readFiles(files, append){
  files = [...files].filter(f=>f && f.name);
  if (!files.length) return;
  files.sort((a,b)=>a.name.localeCompare(b.name,'da',{numeric:true}));
  append = append && S.rows && S.headers;
  S.error=''; S.warn='';
  S.files = append ? S.files.concat(files.map(f=>f.name)) : files.map(f=>f.name);
  S.fileCount = S.files.length;
  S.fileName = S.files.length===1 ? S.files[0] : `${S.files.length} filer`;
  toast(files.length===1 ? 'Læser filen…' : `Læser ${files.length} filer…`);
  let headers = append ? S.headers : null; const rows = append ? S.rows.slice() : []; const mismatched = [];
  const next = (i) => {
    if (i >= files.length){
      if (!rows.length){ S.error='Filerne ser tomme ud, eller de kunne ikke læses som CSV.'; S.rows=null; render(); return; }
      if (mismatched.length) S.warn = `${mismatched.length} ${mismatched.length===1?'fil har':'filer har'} andre kolonner end den første og er sprunget over: ${mismatched.join(', ')}.`;
      S.headers = headers; S.rows = rows; S.map = autoMap(S.headers); finishLoad(); return;
    }
    Papa.parse(files[i], { header:true, skipEmptyLines:true, encoding:'UTF-8',
      complete: res => {
        const h = (res.meta.fields||[]).filter(x=>x!==undefined);
        if (!headers){ headers = h; }
        else if (h.join('\u0001') !== headers.join('\u0001')){ mismatched.push(files[i].name); next(i+1); return; }
        for (const r of res.data) rows.push(r);
        next(i+1);
      },
      error: err => { S.error='Filen '+files[i].name+' kunne ikke læses: '+err.message; render(); }
    });
  };
  next(0);
}
function missingRoles(){ return ROLES.filter(r=>r.req && !S.map[r.id]); }
function finishLoad(){
  if (missingRoles().length){ S.model=null; render(); return; }
  S.full = parseRecs(S.rows, S.map);
  { const seen = new Set(); const uniq = []; let d = 0; for (const x of S.full.recs){ if (x.nr && seen.has(x.nr)){ d++; continue; } if (x.nr) seen.add(x.nr); uniq.push(x); } S.full.recs = uniq; S.dupes = d; uniq.forEach((x,i)=>x.id=i); }
  S.base = sanitizeBase(load('base',{}));
  applyBase();
  const bad = S.model.recs.filter(x=>!x.nr).length;
  if (bad) S.warn = nf(bad)+' rækker uden materialenummer er sprunget over ved eksport.';
  if (S.dupes) S.warn += (S.warn?' ':'')+nf(S.dupes)+' rækker med et materialenummer, der allerede var læst, er sprunget over.';
  if (!S.map.forf) S.warn += (S.warn?' ':'')+'Ingen forfatterkolonne fundet – der grupperes kun på titel.';
  S.results=null; S.checked=new Set(); S.open=new Set();
  render();
}

/* ---------- grundopsætning ---------- */
function sanitizeBase(b){
  const out = {}; if (!b || !S.full) return out;
  for (let i=0;i<S.full.maxLv;i++){ const have = new Set(S.full.recs.map(x=>x.lv[i])); const ex = (b['lv'+i]||[]).filter(v=>have.has(v)); if (ex.length) out['lv'+i]=ex; }
  return out;
}
function applyBase(){
  const ex = []; for (let i=0;i<S.full.maxLv;i++){ const l=S.base['lv'+i]; if (l && l.length) ex.push([i,new Set(l)]); }
  const active = ex.length ? S.full.recs.filter(x => !ex.some(([i,set]) => set.has(x.lv[i]))) : S.full.recs;
  S.model = modelFrom(active, S.full.maxLv, !!S.map.forf);
  S.model.fullCount = S.full.recs.length; S.model.excluded = S.full.recs.length - active.length;
}
function baseView(){
  const fullModel = modelFrom(S.full.recs, S.full.maxLv, !!S.map.forf);
  const parts = fullModel.levelNames.map((n,i)=>{
    const vals = fullModel.fields['lv'+i].values; if (vals.length===1 && vals[0][0]==='') return '';
    const ex = new Set(S.base['lv'+i]||[]);
    const chips = vals.map(([v,c]) => `<label class="chip ${ex.has(v)?'':'on'}"><input type="checkbox" name="base_lv${i}" value="${esc(v)}" ${ex.has(v)?'':'checked'}> ${esc(disp(v))} <span class="n">${nf(c)}</span></label>`).join('');
    return `<div class="lvl"><b>${esc(n)}</b><div class="chipbox" data-name="base_lv${i}"><div class="chips">${chips}</div><div class="chips-tools"><button data-act="allchips">Vælg alle</button><button data-act="nochips">Fravælg alle</button></div></div></div>`;
  }).join('');
  return `<details class="base" ${S.baseOpen?'open':''}><summary><span>Grundopsætning</span><span class="hint">${S.model.excluded ? nf(S.model.excluded)+' materialer fravalgt' : 'alt er med'}</span><span class="chev">${ICON.chev}</span></summary>
    <div class="body"><p class="muted small">Fravælg de steder, der aldrig skal med – fx et arkiv eller tomme filialer. Valget huskes i denne browser og gælder alle opgaver.</p><div class="levelgrid">${parts}</div></div></details>`;
}

function curSettings(){ return S.settings[S.fn]; }
function toolView(){

function chipList(field, selected, name, opts={}){
  const vals = S.model.fields[field].values; const sel = new Set(selected||[]);
  const many = vals.length > 40; const col = !!opts.collapsible;
  const chips = vals.map(([v,n]) => `<label class="chip ${sel.has(v)?'on':''} ${col&&!sel.has(v)?'hid':''}" data-v="${esc(v)}"><input type="checkbox" name="${name}" value="${esc(v)}" ${sel.has(v)?'checked':''}> ${esc(disp(v))} <span class="n">${nf(n)}</span></label>`).join('');
  const unit = opts.unit || 'værdier';
  return `<div class="chipbox ${col?'collapsed':''}" data-name="${name}">${many?`<input class="chips-filter" placeholder="Søg i ${vals.length} ${unit}…">`:''}<div class="chips">${col&&!sel.size&&opts.showAll!==false?`<span class="muted small when-closed">Alle</span>`:''}${chips}</div>
    <div class="chips-tools"><button class="when-open" data-act="allchips">Vælg alle</button><button class="when-open" data-act="nochips">Fravælg alle</button>${opts.note?`<span class="muted">${opts.note}</span>`:''}</div>${col?`<button class="cb-toggle" data-act="togglechips" data-open="${esc(opts.expandLabel || `Vis alle ${vals.length} ${unit}`)}">${opts.expandLabel || `Vis alle ${vals.length} ${unit}`}</button>`:''}</div>`;
}
function levelChecks(sel){
  const m=S.model; const s=new Set(sel||[]);
  return m.levelNames.map((n,i)=>`<label class="chip ${s.has(i)?'on':''}"><input type="checkbox" name="groupLevel" value="${i}" ${s.has(i)?'checked':''}> ${esc(n)}</label>`).join('');
}
function fieldSelect(name, cur){
  const m=S.model; const opts=[]; 
  m.levelNames.forEach((n,i)=>opts.push(['lv'+i,n]));
  if (m.fields.gruppe.values.length>1 || m.fields.gruppe.values[0][0]!=='') opts.push(['gruppe','Materialegruppe']);
  if (m.fields.type.values.length>1) opts.push(['type','Mat. type']);
  return `<select name="${name}"><option value="">Vælg felt…</option>${opts.map(([v,l])=>`<option value="${v}" ${cur===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
}
function sideView(key, label, side, optional){
  return `<div class="side" data-side="${key}"><div class="lbl">${label}${optional?'<span class="opt">valgfri</span>':''}</div>
    <div class="fieldrow">${fieldSelect(key+'_field', side.field)}</div>

const LEVEL_UNITS = {Filial:'filialer', Afdeling:'afdelinger', Sektion:'sektioner', Opstilling:'opstillinger', Delopstilling:'delopstillinger'};
const LEVEL_UNIT = n => LEVEL_UNITS[n] || (n.toLowerCase()+'-værdier');
function placeView(fl){
  const m=S.model; const parts=[];
  m.levelNames.forEach((n,i)=>{ const vals=m.fields['lv'+i].values; if (vals.length===1 && vals[0][0]==='') return;
    parts.push(`<div class="lvlrow"><b>${esc(n)}</b>${chipList('lv'+i, fl['lv'+i], 'f_lv'+i, {collapsible:true, unit:LEVEL_UNIT(n), expandLabel:'Vælg', showAll:false})}</div>`); });
  return `<div class="sec places"><h3>Søg i <span class="hint">intet valgt = alle</span></h3><div class="body">${parts.join('')}</div></div>`;
}
function filtersView(fl){

  parts.push(`<div class="lvl"><b>Mat. type</b>${chipList('type', fl.type, 'f_type')}</div>`);

  return `<details class="sec"><summary><span>Afgræns materialerne</span><span style="display:flex;align-items:center;gap:10px">${cnt?`<span class="cnt">${cnt} ${cnt===1?'aktiv':'aktive'}</span>`:''}<span class="chev">${ICON.chev}</span></span></summary>
    <div class="body levelgrid">${parts.join('')}</div></details>`;

function presetsView(){

  return `<div class="sec"><div class="presets"><select name="preset"><option value="">Gemte indstillinger…</option>${all.map((p,i)=>`<option value="${i}" ${p.name===cur?'selected':''}>${p.fav?'★ ':''}${esc(p.name)}</option>`).join('')}</select>

function panelView(){
  const s = curSettings(); const m = S.model; const fn = S.fn;

      <div class="radio"><span class="muted small">Eksportér:</span>

  }
  body += `<div class="sec"><h3>Tæl inden for samme…</h3><div class="body"><div class="chips">${levelChecks(s.groupLevels)}</div>

    ${m.hasForf?`<label class="chip ${s.useForf!==false?'on':''}" style="margin-top:10px"><input type="checkbox" name="useForf" ${s.useForf!==false?'checked':''}> Skeln mellem forfattere med samme titel</label>`:''}</div></div>`;
  body += placeView(s.filters||{});

  body += `<div class="run"><button class="btn primary" data-act="run">Find</button><button class="btn quiet" data-act="reset" title="Sæt alle indstillinger tilbage til standard">Nulstil</button></div>`;

/* læs indstillinger fra panelet */
function readPanel(){
  const p = document.getElementById('panel'); const s = curSettings();
  const vals = name => [...p.querySelectorAll(`input[name="${name}"]:checked`)].map(i=>i.value);
  s.statuses = vals('status');
  s.groupLevels = vals('groupLevel').map(Number);
  const uf = p.querySelector('input[name="useForf"]'); s.useForf = uf ? uf.checked : true;
  if (S.fn==='flere'){ s.min = Math.max(2, parseInt(p.querySelector('input[name="min"]').value)||2); }
  else {
    for (const k of ['A','B']){ const f = p.querySelector(`select[name="${k}_field"]`).value; s['side'+k] = { field:f, values: f ? vals(k+'_val') : [] }; }
    const ew = p.querySelector('input[name="exportWhat"]:checked'); s.exportWhat = ew ? ew.value : 'A';
  }
  const fl = {};
  fl.type = vals('f_type'); fl.gruppe = vals('f_gruppe');
  S.model.levelNames.forEach((n,i)=>{ fl['lv'+i] = vals('f_lv'+i); });
  fl.klass = { mode: (p.querySelector('select[name="f_klass_mode"]')||{}).value||'is', text: ((p.querySelector('input[name="f_klass_text"]')||{}).value||'').trim() };
  s.filters = fl;
  store('last:'+S.fn, s);
}
function sanitize(s, fn){
  const m=S.model; const d = FUNCTIONS[fn].defaults(m); if (!s) return d;
  const have = f => new Set((m.fields[f]||{values:[]}).values.map(v=>v[0]));
  const keep = (f, arr) => Array.isArray(arr) ? arr.filter(v=>have(f).has(v)) : [];
  const out = { ...d, ...s };
  out.statuses = keep('status', s.statuses); if (!out.statuses.length) out.statuses = d.statuses;
  out.groupLevels = (s.groupLevels||[]).filter(i=>i<m.maxLv);
  const fl = {}; for (const [k,v] of Object.entries(s.filters||{})){ if (k==='klass') fl.klass=v; else if (m.fields[k]) fl[k]=keep(k,v); }
  out.filters = fl;
  for (const k of ['sideA','sideB']){ if (out[k]){ const f=out[k].field; out[k] = (f && m.fields[f]) ? {field:f, values:keep(f,out[k].values)} : {field:'',values:[]}; } }
  return out;
}

/* ---------- resultater ---------- */
function resultsView(){
  if (S.error) return `<div class="empty"><b>Det gik ikke</b>${esc(S.error)}</div>`;
  if (!S.results) return `<div class="empty"><b>Sæt indstillingerne, og tryk Find</b>Resultatet vises her – du kan se og fravælge eksemplarer, før du eksporterer.</div>`;
  const R = S.results; if (!R.length) return `<div class="empty"><b>Ingen titler matcher</b>${S.fn==='flere'?'Prøv et lavere antal, flere statusser eller færre afgrænsninger.':'Prøv andre steder, flere statusser eller færre afgrænsninger.'}</div>`;
  const total = R.reduce((a,g)=>a+g.exp.length,0); const sel = S.checked.size;
  const sorted = sortGroups(R);
  const rows = sorted.slice(0,S.shown).map(groupView).join('');
  return `<div class="rhead"><div class="sum"><b>${nf(R.length)} ${R.length===1?'titel':'titler'}</b> <span>· ${nf(total)} eksemplarer, ${nf(sel)} valgt</span></div>
    <div class="acts"><button class="btn" data-act="print" ${sel?'':'disabled'}>${ICON.print} Hyldeliste</button><button class="btn primary" data-act="csv" ${sel?'':'disabled'}>${ICON.down} CSV til Cicero</button></div></div>
    <div class="rtools"><button data-act="selall">Vælg alle</button><button data-act="selnone">Fravælg alle</button><button data-act="openall">Fold alle ud</button><button data-act="closeall">Fold sammen</button>
      <div class="sort"><span>Sortér efter</span><select name="sort"><option value="forf" ${S.sort==='forf'?'selected':''}>forfatter</option><option value="titel" ${S.sort==='titel'?'selected':''}>titel</option><option value="antal" ${S.sort==='antal'?'selected':''}>antal</option><option value="plac" ${S.sort==='plac'?'selected':''}>placering</option></select></div></div>
    <div class="grps">${rows}</div>
    ${sorted.length>S.shown?`<div class="more"><button class="btn" data-act="more">Vis flere (${nf(sorted.length-S.shown)} tilbage)</button></div>`:''}`;
}
function sortGroups(R){
  const c = new Intl.Collator('da'); const first = g => g.hits[0]||g.items[0];
  const by = {
    forf: (a,b)=> c.compare(first(a).forf||'\uffff', first(b).forf||'\uffff') || c.compare(first(a).stem, first(b).stem),
    titel:(a,b)=> c.compare(first(a).stem, first(b).stem),
    antal:(a,b)=> b.hits.length-a.hits.length || c.compare(first(a).forf, first(b).forf),
    plac: (a,b)=> c.compare(first(a).plac, first(b).plac) || c.compare(first(a).forf, first(b).forf),
  };
  return R.slice().sort(by[S.sort]||by.forf);
}
function groupView(g){
  const f = g.hits[0]||g.items[0]; const expIds = new Set(g.exp.map(x=>x.id));
  const nSel = g.exp.filter(x=>S.checked.has(x.id)).length;
  const titles = new Set(g.items.map(x=>x.titel)); const multi = titles.size>1;
  const marks = f.marks.length ? `<span class="badge">${esc(f.marks.join(', '))}</span>` : '';
  const placs = [...new Set(g.hits.map(x=>x.lv.filter(Boolean).join(' / ')))];
  const placTxt = placs.length===1 ? placs[0] : placs.length+' placeringer';
  const open = S.open.has(g.k);
  const items = g.items.slice().sort((a,b)=> a.plac.localeCompare(b.plac,'da') || a.titel.localeCompare(b.titel,'da')).map(x=>{
    const inExp = expIds.has(x.id);
    return `<tr class="${inExp?'':'dim'}"><td class="chk"><input type="checkbox" data-id="${x.id}" ${S.checked.has(x.id)?'checked':''} ${inExp?'':'disabled'}></td>
      <td>${esc(x.titel)}</td><td>${esc(x.lv.filter(Boolean).join(' / '))}</td>
      <td class="st"><span class="badge ${x.status==='Hjemme'?'green':''}">${esc(x.status)}</span></td><td>${esc(x.gruppe)}</td><td class="nr">${esc(x.nr)}</td></tr>`; }).join('');
  return `<div class="grp ${open?'open':''}" data-k="${esc(g.k)}"><div class="row" data-act="toggle">
      <button class="tog" aria-label="Fold ud">${ICON.chev}</button>
      <input type="checkbox" data-grp="${esc(g.k)}" ${nSel===g.exp.length?'checked':''} aria-label="Vælg alle i gruppen">
      <div class="main"><span class="ttl">${esc(multi ? f.stem : f.titel)}</span> <span class="aut">${f.forf?'– '+esc(f.forf):''}</span>
        <div class="meta">${marks}${multi?`<span class="badge amber">${titles.size} udgaver</span>`:''}<span class="badge">${esc(placTxt)}</span>${g.items.length>g.hits.length?`<span class="badge">+${g.items.length-g.hits.length} andre eksemplarer</span>`:''}</div></div>
      <div class="cnt">${g.hits.length}<small>${nSel} valgt</small></div></div>
    <div class="items"><div class="tblwrap"><table><thead><tr><th></th><th>Titel</th><th>Placering</th><th>Status</th><th>Gruppe</th><th>Materialenr.</th></tr></thead><tbody>${items}</tbody></table></div></div></div>`;
}

/* ---------- handlinger ---------- */
function run(){
  readPanel(); S.error='';
  const r = FUNCTIONS[S.fn].run(S.model, curSettings());
  if (r && r.error){ S.error=r.error; S.results=null; }
  else { S.results=r; S.checked=new Set(r.flatMap(g=>g.exp.map(x=>x.id))); S.open=new Set(); S.shown=150; }
  const el = document.getElementById('results'); el.innerHTML = resultsView(); if (window.innerWidth<860) el.scrollIntoView({behavior:'smooth'});
  if (!S.error) toast(S.results.length ? `${nf(S.results.length)} titler fundet` : 'Ingen titler matcher');
}
function checkedItems(){ const ids=S.checked; return S.results.flatMap(g=>g.exp.filter(x=>ids.has(x.id))); }
function exportCsv(){
  const items = checkedItems().filter(x=>x.nr);
  const seen = new Set(); const lines = []; for (const x of items){ if (!seen.has(x.nr)){ seen.add(x.nr); lines.push(x.nr); } }
  const blob = new Blob([lines.join('\r\n')+'\r\n'], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`hyldetjek-${S.fn}-${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast(`${nf(lines.length)} materialenumre hentet`);
}
function printList(){
  const items = checkedItems(); const c = new Intl.Collator('da');
  items.sort((a,b)=> c.compare(a.plac,b.plac) || c.compare(a.forf||'\uffff', b.forf||'\uffff') || c.compare(a.stem,b.stem) || c.compare(a.titel,b.titel));
  const s = curSettings(); const f = FUNCTIONS[S.fn];
  let meta = `${new Date().toLocaleDateString('da-DK')} · ${esc(S.fileName)} · ${nf(items.length)} eksemplarer`;
  if (S.fn==='flere') meta += ` · mindst ${s.min} med status ${s.statuses.join('/')}`;
  let html = `<h1>Hyldeliste: ${esc(f.title)}</h1><div class="pm">${meta}</div>`;
  let cur = null;
  for (const x of items){
    const p = x.lv.filter(Boolean).join(' / ') || '(ingen placering)';
    if (p !== cur){ if (cur!==null) html += '</tbody></table>'; cur = p; html += `<h2>${esc(p)}</h2><table><thead><tr><th></th><th>Forfatter</th><th>Titel</th><th>Status</th><th>Materialenr.</th></tr></thead><tbody>`; }
    html += `<tr><td class="bx"><span></span></td><td>${esc(x.forf)}</td><td>${esc(x.titel)}</td><td>${esc(x.status)}</td><td class="nr">${esc(x.nr)}</td></tr>`;
  }
  if (cur!==null) html += '</tbody></table>';
  document.getElementById('print').innerHTML = html;
  window.print();
}

/* ---------- events ---------- */
function bind(){ /* alt er delegeret fra $app – se init() */ }
function init(){
  $app.addEventListener('click', onClick);
  $app.addEventListener('change', onChange);
  $app.addEventListener('input', onInput);
  ['dragenter','dragover'].forEach(ev=>$app.addEventListener(ev, e=>{ const d=e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('over'); } }));
  $app.addEventListener('dragleave', e=>{ const d=e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  $app.addEventListener('drop', e=>{ const d=e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.remove('over'); readFiles(e.dataTransfer.files, !!S.model); } });
  render();
}
function onClick(e){
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act==='home'){ S.view='home'; S.error=''; render(); return; }
  if (act==='pick'||act==='addfiles'){ const inp=document.getElementById('fileInput'); inp.dataset.mode = act==='addfiles' ? 'append' : 'replace'; inp.click(); return; }
  if (act==='open'){ S.fn=b.dataset.fn; S.view='tool'; S.results=null; S.error=''; S.presetName=''; S.settings[S.fn] = sanitize(load('last:'+S.fn,null), S.fn); { const d = FUNCTIONS[S.fn].defaults(S.model); if (d.statuses.length) S.settings[S.fn].statuses = d.statuses; } render(); window.scrollTo(0,0); return; }
  if (act==='applymap'){ const m={}; $app.querySelectorAll('select[data-role]').forEach(s=>{ if (s.value) m[s.dataset.role]=s.value; }); S.map=m; if (missingRoles().length){ toast('De fire første kolonner skal vælges'); return; } finishLoad(); return; }
  if (act==='run'){ run(); return; }
  if (act==='togglechips'){ e.preventDefault(); const box=b.closest('.chipbox'); const collapse = !box.classList.contains('collapsed'); b.textContent = collapse ? b.dataset.open : 'Skjul'; if (collapse){ box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('hid', !c.querySelector('input').checked)); const any=[...box.querySelectorAll('.chip input')].some(i=>i.checked); const alle=box.querySelector('.chips .when-closed'); if (alle) alle.style.display = any?'none':''; } box.classList.toggle('collapsed', collapse); return; }
  if (act==='allchips'||act==='nochips'){ e.preventDefault(); const box=b.closest('.chipbox'); box.querySelectorAll('input[type=checkbox]').forEach(i=>{ if (i.closest('.chip').style.display!=='none'){ i.checked = act==='allchips'; i.closest('.chip').classList.toggle('on', i.checked); } }); if ((box.dataset.name||'').startsWith('base_lv')) onBaseChange(); return; }
  if (act==='savepreset'){ const f=document.querySelector('.saveform'); const sel=document.querySelector('select[name="preset"]'); const mine=load('presets',[]).filter(p=>p.fn===S.fn); const cur = sel.value ? mine[+sel.value] : null; f.querySelector('input[name="presetName"]').value = cur ? cur.name : ''; f.querySelector('input[name="presetFav"]').checked = !!(cur && cur.fav); f.querySelector('input[name="presetFav"]').closest('.chip').classList.toggle('on', !!(cur&&cur.fav)); f.classList.remove('hidden'); f.querySelector('input[name="presetName"]').focus(); return; }
  if (act==='savecancel'){ document.querySelector('.saveform').classList.add('hidden'); return; }
  if (act==='savepreset2'){ const f=document.querySelector('.saveform'); const name=f.querySelector('input[name="presetName"]').value.trim(); if (!name){ toast('Giv indstillingen et navn'); return; } const fav=f.querySelector('input[name="presetFav"]').checked; readPanel(); const all=load('presets',[]); const i=all.findIndex(p=>p.fn===S.fn&&p.name===name); const p={name, fn:S.fn, settings:curSettings(), fav}; if (i>=0) all[i]=p; else all.push(p); store('presets',all); S.presetName=name; toast(fav?'Gemt – ligger nu på forsiden':'Gemt'); rerenderPanel(); return; }
  if (act==='reset'){ S.settings[S.fn] = FUNCTIONS[S.fn].defaults(S.model); S.presetName=''; try{ localStorage.removeItem('hyldetjek:last:'+S.fn); }catch(e){} S.results=null; S.error=''; rerenderPanel(); refreshResults(); toast('Nulstillet'); return; }
  if (act==='fav'){ const p=load('presets',[]).find(x=>x.fn===b.dataset.fn && x.name===b.dataset.name); if (!p) return; S.fn=p.fn; S.view='tool'; S.results=null; S.error=''; S.settings[S.fn]=sanitize(p.settings, S.fn); S.presetName=p.name; render(); window.scrollTo(0,0); run(); return; }
  if (act==='delpreset'){ const sel=document.querySelector('select[name="preset"]'); if (!sel.value){ toast('Vælg først en gemt indstilling'); return; } const mine=load('presets',[]).filter(p=>p.fn===S.fn); const victim=mine[+sel.value]; if (!confirm(`Slet "${victim.name}"?`)) return; store('presets', load('presets',[]).filter(p=>!(p.fn===victim.fn&&p.name===victim.name))); if (S.presetName===victim.name) S.presetName=''; toast('Slettet'); rerenderPanel(); return; }
  if (act==='exportpresets'){ const all=load('presets',[]); if (!all.length){ toast('Der er ingen gemte indstillinger endnu'); return; } const blob=new Blob([JSON.stringify({hyldetjek:1, presets:all},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hyldetjek-indstillinger.json'; a.click(); return; }
  if (act==='importpresets'){ document.getElementById('presetFile').onchange = ev => { const f=ev.target.files[0]; if (!f) return; f.text().then(t=>{ try{ const j=JSON.parse(t); if (!j||!Array.isArray(j.presets)) throw 0; const all=load('presets',[]); let n=0; for (const p of j.presets){ if (!p.fn||!p.name||!FUNCTIONS[p.fn]) continue; const i=all.findIndex(q=>q.fn===p.fn&&q.name===p.name); if (i>=0) all[i]=p; else all.push(p); n++; } store('presets',all); toast(`${n} indstillinger hentet`); rerenderPanel(); }catch(err){ toast('Filen er ikke en indstillingsfil fra Hyldetjek'); } }); }; document.getElementById('presetFile').click(); return; }
  if (act==='toggle'){ if (e.target.closest('input')) return; const k=b.closest('.grp').dataset.k; S.open.has(k)?S.open.delete(k):S.open.add(k); b.closest('.grp').classList.toggle('open'); return; }
  if (act==='openall'||act==='closeall'){ const all=act==='openall'; S.open = all ? new Set(S.results.map(g=>g.k)) : new Set(); document.querySelectorAll('.grp').forEach(g=>g.classList.toggle('open',all)); return; }
  if (act==='selall'||act==='selnone'){ S.checked = act==='selall' ? new Set(S.results.flatMap(g=>g.exp.map(x=>x.id))) : new Set(); refreshResults(); return; }
  if (act==='more'){ S.shown += 150; refreshResults(); return; }
  if (act==='csv'){ exportCsv(); return; }
  if (act==='print'){ printList(); return; }
}
function onBaseChange(){
  const b = {};
  for (let i=0;i<S.full.maxLv;i++){ const ex=[...$app.querySelectorAll(`input[name="base_lv${i}"]:not(:checked)`)].map(x=>x.value); if (ex.length) b['lv'+i]=ex; }
  S.base = b; store('base', b); S.baseOpen = true; applyBase(); S.results=null; render();
}
function refreshResults(){ const el=document.getElementById('results'); const y=window.scrollY; el.innerHTML=resultsView(); window.scrollTo(0,y); }
function rerenderPanel(){ document.getElementById('panel').innerHTML = panelView(); }
function onChange(e){
  const t = e.target;
  if (t.matches('input[type=file]') && t.id!=='presetFile'){ const fs=[...t.files]; if (fs.length) readFiles(fs, t.dataset.mode==='append'); t.value=''; return; }
  if (t.matches('.chip input')){ t.closest('.chip').classList.toggle('on', t.checked); if (t.name.startsWith('base_lv')) onBaseChange(); return; }
  if (t.matches('select[name="A_field"], select[name="B_field"]')){ readPanel(); rerenderPanel(); return; }
  if (t.matches('select[name="preset"]')){ if (!t.value) return; const mine=load('presets',[]).filter(p=>p.fn===S.fn); const p=mine[+t.value]; if (p){ S.settings[S.fn]=sanitize(p.settings,S.fn); S.presetName=p.name; rerenderPanel(); toast(`"${p.name}" hentet`); } return; }
  if (t.matches('select[name="sort"]')){ S.sort=t.value; refreshResults(); return; }
  if (t.matches('input[data-id]')){ const id=+t.dataset.id; t.checked?S.checked.add(id):S.checked.delete(id); updateCounts(t.closest('.grp')); return; }
  if (t.matches('input[data-grp]')){ const grp=t.closest('.grp'); const g=S.results.find(x=>x.k===t.dataset.grp); g.exp.forEach(x=> t.checked?S.checked.add(x.id):S.checked.delete(x.id)); grp.querySelectorAll('input[data-id]').forEach(i=>i.checked=t.checked); updateCounts(grp); return; }
}
function updateCounts(grp){
  const g=S.results.find(x=>x.k===grp.dataset.k); const n=g.exp.filter(x=>S.checked.has(x.id)).length;
  grp.querySelector('.cnt small').textContent = n+' valgt'; grp.querySelector('input[data-grp]').checked = n===g.exp.length;
  const sum=document.querySelector('.rhead .sum span'); const total=S.results.reduce((a,x)=>a+x.exp.length,0);
  if (sum) sum.textContent = `· ${nf(total)} eksemplarer, ${nf(S.checked.size)} valgt`;
  document.querySelectorAll('[data-act="print"],[data-act="csv"]').forEach(b=>b.disabled=!S.checked.size);
}
function onInput(e){
  const t=e.target;
  if (t.matches('.chips-filter')){ const q=norm(t.value); t.closest('.chipbox').querySelectorAll('.chip').forEach(c=>{ c.style.display = !q || norm(c.dataset.v).includes(q) ? '' : 'none'; }); }
}
init();
</script>
