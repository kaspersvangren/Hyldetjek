<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyldetjek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#F6F7F4;
  --card:#FFFFFF;
  --ink:#1E2A36;
  --ink-2:#4A5763;
  --ink-3:#7C8792;
  --rule:#D9DED8;
  --rule-2:#EDEFEA;
  --green:#2F6B4F;
  --green-2:#E4F0EA;
  --green-3:#1F4D38;
  --amber:#B9861E;
  --amber-2:#FBF1DC;
  --red:#A63D2F;
  --red-2:#F8E5E1;
  --focus:#2F6B4F;
  --radius:10px;
  --radius-s:6px;
  --shadow:0 1px 2px rgba(30,42,54,.06), 0 4px 16px rgba(30,42,54,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151A1F; --card:#1E252C; --ink:#EDEFEA; --ink-2:#B9C1C8; --ink-3:#7F8A94;
    --rule:#334049; --rule-2:#28323A;
    --green:#6FB58F; --green-2:#213A2E; --green-3:#9AD1B3;
    --amber:#E0B25A; --amber-2:#3A3120;
    --red:#E08B7D; --red-2:#402420;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    --paper:#151A1F; --card:#1E252C; --ink:#EDEFEA; --ink-2:#B9C1C8; --ink-3:#7F8A94;
    --rule:#334049; --rule-2:#28323A;
    --green:#6FB58F; --green-2:#213A2E; --green-3:#9AD1B3;
    --amber:#E0B25A; --amber-2:#3A3120;
    --red:#E08B7D; --red-2:#402420;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{font-size:16px}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:var(--green)}
button{font:inherit; color:inherit}
h1,h2,h3{margin:0; font-weight:700; line-height:1.2}
h1{font-size:1.9rem; letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.hidden{display:none !important}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}

.wrap{max-width:1120px; margin:0 auto; padding:0 20px}

/* ---------- top bar ---------- */
.top{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:18px 0 14px; border-bottom:1px solid var(--rule);
}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); background:none; border:0; padding:0; cursor:pointer}
.brand svg{width:28px; height:28px; display:block}
.brand b{font-size:1.15rem; letter-spacing:-.01em}
.top .ver{font-size:.75rem; color:var(--ink-3); text-decoration:none; align-self:flex-end; padding:2px 6px 3px; border-radius:4px; margin-right:auto}
@media (max-width:600px){ .top .ver{display:none} }
.top .ver:hover{color:var(--green); background:var(--green-2)}
.top .file{display:flex; align-items:center; gap:12px; font-size:.9rem; color:var(--ink-2); min-width:0}
.top .file .btn{white-space:nowrap}
@media (max-width:600px){ .top .file > span:not(.name):not(.agedot){display:none} .top .file .name{max-width:9em} }
.top .file .name{font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 16px;
  border-radius:var(--radius-s); border:1px solid var(--rule); background:var(--card);
  cursor:pointer; font-weight:700; line-height:1.2; transition:background .12s, border-color .12s;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--green); border-color:var(--green); color:#fff}
.btn.primary:hover{background:var(--green-3); border-color:var(--green-3)}
.btn.quiet{background:transparent; border-color:transparent; color:var(--green); padding:6px 8px}
.btn.quiet:hover{background:var(--green-2); border-color:transparent}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn svg{width:18px; height:18px}

/* ---------- home ---------- */
.home{display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,42%); gap:34px; align-items:start; padding:44px 0 30px}
@media (max-width:900px){ .home{grid-template-columns:1fr; gap:24px; padding-top:32px} }
.hero h1{text-wrap:balance}
.hero p{margin-top:10px; font-size:1.05rem; color:var(--ink-2); max-width:46ch}
.slots{display:flex; flex-direction:column; gap:14px}

.drop{padding:26px 22px; text-align:center; display:block;
  border:2px dashed var(--rule); border-radius:var(--radius); background:var(--card);
  cursor:pointer; transition:border-color .12s, background .12s;}
.drop:hover, .drop.over{border-color:var(--green); background:var(--green-2)}
.drop strong{font-size:1rem}
.drop .sub{margin-top:6px; color:var(--ink-2); font-size:.9rem}
.drop .sub2{margin-top:10px; font-size:.82rem; color:var(--ink-3)}
.drop input{display:none}
.drop.small{padding:20px 18px}

.loaded{padding:16px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  border-radius:var(--radius); background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow);}
.loaded.over{border-color:var(--green); background:var(--green-2)}
.loaded > .cardico{width:34px; height:34px; border-radius:50%; background:var(--green-2); color:var(--green); display:grid; place-items:center; flex:none}
.loaded > .cardico svg{width:18px;height:18px}
.loaded.ill > .cardico{background:var(--amber-2); color:var(--amber)}
.loaded.ill .age.ok{color:var(--ink-2)}
.loaded .facts{flex:1; min-width:150px}
.loaded .facts b{display:block; font-size:1rem}
.loaded .facts span{color:var(--ink-2); font-size:.875rem}
.loaded .acts{display:flex; gap:8px; flex-wrap:wrap}
.loaded .acts .btn{padding:8px 12px; font-size:.875rem}
.loaded .age{flex-basis:100%; display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--ink-2); order:4; position:relative; z-index:1}
.loaded .age.gul{color:var(--amber); font-weight:700}
.loaded .age.rod{color:var(--red); font-weight:700}
.loaded .age .help{border-color:currentColor; color:inherit; background:transparent}
.loaded .helptext{order:5; flex-basis:100%; margin:0}
.loaded .filelist{order:6; flex-basis:100%; display:flex; flex-wrap:wrap; gap:5px 10px; font-size:.8rem; color:var(--ink-3); border-top:1px solid var(--rule-2); padding-top:9px}
.loaded .filelist:empty{display:none}
.fchip{display:inline-flex; align-items:center; gap:5px; white-space:nowrap; cursor:default}
.fdot{width:12px; height:12px; border-radius:50%; display:inline-grid; place-items:center; font-size:9px; font-weight:700; line-height:1; color:#fff; flex:none}
.fdot.ok{background:var(--green)}
.fdot.gul{background:var(--amber)}
.fdot.rod{background:var(--red)}
.fdot.none{background:var(--rule); color:var(--ink-2)}

.illslot{margin:0}
.illadd{width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:14px 18px;
  background:var(--card); border:1px dashed var(--rule); border-radius:var(--radius); cursor:pointer; text-align:left}
.illadd:hover{border-color:var(--green); background:var(--green-2)}
.illadd svg{width:22px;height:22px;color:var(--green)}
.illadd b{display:block; font-size:.95rem}
.illadd i{font-style:normal; color:var(--ink-2); font-size:.85rem}
.illadd .go{color:var(--green); font-weight:700; white-space:nowrap; font-size:.875rem}

.foot{margin:0 0 64px}
.warn{margin:14px 0 0; padding:12px 16px; border-radius:var(--radius-s); background:var(--amber-2); color:var(--ink); border-left:4px solid var(--amber); font-size:.9rem}
.err{margin:0 0 24px; padding:12px 16px; border-radius:var(--radius-s); background:var(--red-2); border-left:4px solid var(--red); font-size:.925rem}
.linkbtn{background:none; border:0; padding:0; color:var(--green); font:inherit; font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:2px}

.fns{list-style:none; margin:0 0 34px; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(330px,1fr)); gap:14px}
.fns li{border:1px solid var(--rule); border-radius:var(--radius); background:var(--card); display:flex; flex-direction:column}
.fns li.off{background:transparent; border-style:dashed}
.fn{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:center;
  width:100%; padding:18px; background:none; border:0; text-align:left; cursor:pointer; border-radius:var(--radius); flex:1}
.fn:hover:not(:disabled){background:var(--green-2)}
.fn:disabled{cursor:default}
.fn:disabled .ico,.fn:disabled .t,.fn:disabled .d{opacity:.5}
.fn .ico{width:40px; height:40px; border-radius:var(--radius-s); background:var(--green-2); color:var(--green); display:grid; place-items:center; grid-row:1/3}
.fn .ico svg{width:22px; height:22px}
.fn .t{font-size:1.05rem; font-weight:700; align-self:end}
.fn .d{color:var(--ink-2); font-size:.9rem; align-self:start}
.fn .d i{font-style:normal; color:var(--ink-3)}
.favs{display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 16px}
.fav{display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 9px; border-radius:999px;
  border:1px solid var(--rule); background:var(--paper); font-size:.85rem; font-weight:700; color:var(--ink); cursor:pointer}
.fav:hover{border-color:var(--green); background:var(--green-2); color:var(--green-3)}
.fav svg{width:14px;height:14px;color:var(--amber)}

.mapping{margin:0; padding:20px 22px; border-radius:var(--radius); background:var(--card); border:1px solid var(--rule)}
.mapping h3{margin-bottom:6px}
.mapping .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px 18px; margin-top:14px}
.mapping label{display:flex; flex-direction:column; gap:4px; font-size:.9rem}
.mapping select{padding:8px; border-radius:var(--radius-s); border:1px solid var(--rule); background:var(--paper); color:var(--ink); font:inherit}

/* ---------- tool ---------- */
.toolhead{padding:22px 0 18px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap}
.toolhead .back{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2); text-decoration:none; background:none; border:0; padding:0; cursor:pointer; font-size:.925rem; margin-bottom:8px}
.toolhead .back:hover{color:var(--green)}
.toolhead .back svg{width:16px;height:16px}
.toolhead .explain{color:var(--ink-2); max-width:60ch; margin-top:4px}
details.howto{margin-top:14px; max-width:68ch; border:1px solid var(--rule); border-radius:var(--radius); background:var(--card)}
details.howto summary{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; font-weight:700; font-size:.925rem}
details.howto summary::-webkit-details-marker{display:none}
details.howto summary .chev{color:var(--ink-3); transition:transform .15s; display:flex}
details.howto summary .chev svg{width:16px;height:16px}
details.howto[open] summary .chev{transform:rotate(90deg)}
details.howto .lead{margin:0; padding:12px 16px 0; border-top:1px solid var(--rule-2); color:var(--ink-2); font-size:.9rem}
details.howto dl{margin:0; padding:2px 16px 16px}
details.howto dt{font-weight:700; font-size:.9rem; margin-top:12px}
details.howto dd{margin:2px 0 0; color:var(--ink-2); font-size:.925rem}

.tool{display:grid; grid-template-columns:340px minmax(0,1fr); gap:28px; align-items:start; padding-bottom:64px}
@media (max-width:860px){.tool{grid-template-columns:1fr}}

.panel{background:var(--card); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow)}
@media (min-width:861px){
  .panel{position:sticky; top:14px; max-height:calc(100vh - 28px); overflow-y:auto; overscroll-behavior:contain}
}
.panel .sec{padding:16px 18px; border-bottom:1px solid var(--rule-2)}
.panel .sec:last-child{border-bottom:0}
.panel .sec h3{display:flex; align-items:center; justify-content:space-between; font-size:.95rem}
.panel .sec h3 .hint{font-weight:400; color:var(--ink-3); font-size:.8rem}
.panel .sec h3 .lbl2{display:flex; align-items:center; gap:7px}
.help{width:18px; height:18px; flex:none; border-radius:50%; border:1px solid var(--rule); background:var(--card); color:var(--ink-3); font-size:.72rem; font-weight:700; line-height:1; cursor:pointer; padding:0; display:inline-grid; place-items:center}
.help:hover, .help.on{border-color:var(--green); color:var(--green); background:var(--green-2)}
.helptext{margin:10px 0 0; padding:10px 12px; border-left:3px solid var(--green); background:var(--green-2); color:var(--ink); border-radius:0 var(--radius-s) var(--radius-s) 0; font-size:.875rem; line-height:1.45}
.side .lbl{align-items:center}
.panel .sec .body{margin-top:10px}
.panel details.sec summary{cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:.95rem}
.panel details.sec summary::-webkit-details-marker{display:none}
.panel details.sec summary .chev{transition:transform .15s; color:var(--ink-3)}
.panel details.sec[open] summary .chev{transform:rotate(90deg)}
.panel details.sec summary .cnt{font-weight:400; color:var(--green); font-size:.85rem}
.panel .run{padding:16px 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--rule-2); border-radius:0 0 var(--radius) var(--radius); z-index:3}
.panel .run .btn.primary{flex:1; justify-content:center}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 10px 5px 8px; border-radius:999px;
  border:1px solid var(--rule); background:var(--paper); cursor:pointer; font-size:.875rem; user-select:none;
}
.chip input{margin:0; accent-color:var(--green)}
.chip .n{color:var(--ink-3); font-size:.78rem}
.chip.on{background:var(--green-2); border-color:var(--green); color:var(--green-3)}
.chip.on .n{color:var(--green)}
.chips-tools{display:flex; gap:12px; margin-top:8px; font-size:.8rem; align-items:center}
.sorttools{margin-left:auto; display:inline-flex; gap:4px; align-items:center}
.chips-top{display:flex; justify-content:flex-end; margin-bottom:6px}
.chipbox.collapsed .chips-top{display:none}
.lvlhead{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.lvlhead b{font-size:.9rem}
.lvlrow .chips-top{grid-column:1/-1; margin:0 0 2px}
.sorttools button{border:1px solid var(--rule); background:var(--card); color:var(--ink-2); border-radius:var(--radius-s); padding:2px 7px; font-size:.75rem; font-weight:700; cursor:pointer; line-height:1.4}
.sorttools button:hover{border-color:var(--green); color:var(--green)}
.lvlrow .sorttools{margin-left:auto}
.chipbox.collapsed .chip.hid{display:none}
.chipbox.collapsed .chips-filter{display:none}
.chipbox.collapsed .when-open{display:none}
.chipbox:not(.collapsed) .when-closed{display:none}
.chipbox{display:flex; flex-direction:column}
.chipbox .chips-filter{order:1} .chipbox .chips{order:2} .chipbox .chips-tools{order:3}
.chipbox.long:not(.collapsed) .chips{max-height:250px; overflow-y:auto; padding-right:4px; align-content:flex-start}
.chipbox.long .chips-filter{position:sticky; top:0; z-index:2}
.chipbox.long .chips{scrollbar-width:thin}
.chipbox .cb-toggle{order:4; align-self:flex-start; background:none; border:0; padding:0; margin-top:8px; color:var(--green); cursor:pointer; font-weight:700; font-size:.8rem}
.chipbox.collapsed .chips-tools:empty{display:none}
.chips .when-closed{align-self:center; padding:5px 0}
.lvlrow{display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--rule-2)}
.lvlrow:last-child{border-bottom:0}
.lvlrow > b{font-size:.875rem; color:var(--ink-2); grid-column:1; grid-row:1}
.lvlrow .chipbox{display:contents}
.lvlrow .chipbox .cb-toggle{grid-column:2; grid-row:1; margin:0}
.lvlrow .chipbox .chips-filter{grid-column:1/-1}
.lvlrow .chipbox .chips-top{grid-column:1/-1; justify-content:flex-start}
.lvlrow .chipbox .chips{grid-column:1/-1}
.lvlrow .chipbox .chips:empty{display:none}
.lvlrow .chipbox.collapsed .chips-tools{display:none}
.lvlrow .chipbox .chips-tools{grid-column:1/-1; margin:0}
.panel details.sec summary .chev svg{width:16px;height:16px;display:block}
details.base{margin:0; background:var(--card); border:1px solid var(--rule); border-radius:var(--radius); padding:0 20px}
details.base summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:14px 0; font-weight:700}
details.base summary::-webkit-details-marker{display:none}
details.base summary .hint{font-weight:400; color:var(--green); font-size:.875rem; flex:1}
details.base summary .chev{color:var(--ink-3); transition:transform .15s}
details.base summary .chev svg{width:16px;height:16px}
details.base[open] summary .chev{transform:rotate(90deg)}
details.base .body{padding:4px 0 18px; border-top:1px solid var(--rule-2)}
details.base .body > p{margin:12px 0 14px}
.chips-tools button{background:none; border:0; padding:0; color:var(--green); cursor:pointer; font-weight:700}
.chips-filter{width:100%; padding:7px 10px; margin-bottom:8px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--paper); color:var(--ink); font:inherit; font-size:.875rem}
.fieldrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.fieldrow select,.fieldrow input[type=text],.fieldrow input[type=number]{
  padding:7px 10px; border:1px solid var(--rule); border-radius:var(--radius-s); background:var(--paper); color:var(--ink); font:inherit; font-size:.9rem;
}
.fieldrow input[type=number]{width:74px}
.fieldrow label{font-size:.9rem}
.levelgrid{display:grid; grid-template-columns:1fr; gap:14px}
.levelgrid .lvl b{display:block; font-size:.85rem; margin-bottom:6px; color:var(--ink-2)}
.side{padding:12px; border:1px solid var(--rule); border-radius:var(--radius-s); margin-bottom:10px; background:var(--paper)}
.side .lbl{font-weight:700; font-size:.9rem; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between}
.side .lbl .opt{font-weight:400; color:var(--ink-3); font-size:.8rem}
.side .chips .chip{background:var(--card)}
.radio{display:flex; gap:14px; flex-wrap:wrap; font-size:.9rem}
.radio label{display:flex; align-items:center; gap:6px; cursor:pointer}
.radio input{accent-color:var(--green)}

/* ---------- results ---------- */
.results{min-height:200px}
.results .empty{padding:48px 24px; text-align:center; color:var(--ink-2); border:1px dashed var(--rule); border-radius:var(--radius)}
.results .empty b{display:block; color:var(--ink); margin-bottom:4px; font-size:1.05rem}
.rsticky{position:sticky; top:0; background:var(--paper); z-index:4; padding-top:10px}
.rhead{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:0 0 12px}
.rhead .sum b{font-size:1.15rem}
.rhead .sum span{color:var(--ink-2)}
.rhead .acts{display:flex; gap:8px; flex-wrap:wrap}
.rtools{display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:.85rem; padding:8px 0 10px; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule)}
.rtools button{background:none;border:0;padding:0;color:var(--green);cursor:pointer;font-weight:700}
.rtools .sort{margin-left:auto; display:flex; gap:6px; align-items:center; color:var(--ink-2)}
.rtools .sort select{padding:4px 6px; border:1px solid var(--rule); border-radius:4px; background:var(--card); color:var(--ink); font:inherit; font-size:.85rem}

.grp{border-bottom:1px solid var(--rule)}
.grp .row{display:grid; grid-template-columns:auto auto 1fr auto; gap:12px; align-items:center; padding:12px 6px; cursor:pointer}
.grp .row:hover{background:var(--card)}
.grp .row .tog{width:22px;height:22px;display:grid;place-items:center;color:var(--ink-3);border:0;background:none;padding:0}
.grp .row .tog svg{width:14px;height:14px;transition:transform .15s}
.grp.open .row .tog svg{transform:rotate(90deg)}
.grp .row input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--green);cursor:pointer}
.grp .main{min-width:0}
.grp .main .aut{font-weight:700; display:block; line-height:1.35}
.grp .main .ttl{color:var(--ink-2); display:block; line-height:1.35}
.grp .main .meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; font-size:.8rem}

<body>
<div id="app"></div>
<div id="print"></div>
<button id="totop" class="totop" aria-label="Til toppen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>Til toppen</button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* ===================================================================
   Hyldetjek 1.15.0 (10. sept. 2026) — klientside-værktøj til hyldearbejde ud fra en
   materialeeksport fra Cicero. Alt sker i browseren; intet sendes.
   Versioner:
   1.0.0  første udgave: tre funktioner, hyldeliste, CSV til Cicero, gemte indstillinger
   1.1.0  grundopsætning (fravælg steder én gang for alle), "Søg i"-afsnit med
          filial/afdeling/sektion/opstilling/delopstilling, statusser foldet sammen
          med Hjemme som standard, femte placeringsniveau navngivet, versionsnummer i toppen
   1.2.0  niveaunavne rettet til Ciceros model (Filial/Afdeling/Opstilling/Delopstilling) og
          kan rettes af brugeren i Grundopsætningen; flere CSV-filer kan læses ind på én gang
          (lægges sammen, dubletter på materialenummer fjernes)
   1.3.0  niveaunavne er faste igen (Ciceros fem, Sektion kun ved fem led; blandede filer får
          tom Sektion indsat); vælg/fravælg alle pr. niveau i Grundopsætningen; "Tilføj filer"
          og "Start forfra" i stedet for "Vælg en anden fil", filliste på forsiden; Skjul-knappen
          bliver på Vælg-knappens plads
   1.4.0  Nulstil-knap i funktionerne; gemte indstillinger kan markeres som favorit og vises
          som genveje under funktionen på forsiden (åbner og kører med det samme); Gem sker i
          en lille linje i panelet i stedet for en dialogboks
   1.4.1  overskriften "Tæl inden for samme…" i ét stykke
   1.4.2  dobbelte materialenumre: rækken uden "Hjemme" beholdes; klarere besked; knap til at
          hente numrene som CSV
   1.5.0  ny titelnøgle: undertitler beholdes, medmindre de er genre ("roman", "krimi"…),
          format ("mp3", storskriftserie), oversætter/udgave ("Ved …", "Ill. …") eller
          bindangivelse. "PS: jeg elsker dig" og "PS: Jeg elsker dig for evigt" er nu to titler
   1.5.1  "Ved …" og "Ill. …" beholdes i titlen igen – de kan betyde forskellige udvalg
          (H.C. Andersens Eventyr), ikke kun oversætter. Kun rene udgave-led fjernes
   1.6.0  forfatteren står først på egen linje i resultatet og på hyldelisten; hyldelisten har
          en kolonne der viser hvor mange af titlen der er talt med, og hvor resten står
   1.6.1  mærkatet hedder "N titelvarianter" i stedet for "N udgaver" – tallet er antallet af
          forskellige titelstrenge, ikke et sikkert antal udgaver
   1.7.0  hjælp overalt: hver funktion har en konkret beskrivelse og et "Sådan bruger du den"-
          afsnit med eksempler; hvert felt i panelet har et spørgsmålstegn med forklaring
   1.8.0  hver liste af valgmuligheder kan sorteres alfabetisk eller efter antal og vendes om;
          delopstilling og mat. type står alfabetisk som udgangspunkt, resten efter antal
   1.8.1  sorteringsknapperne står øverst i listen i stedet for nederst
   1.8.2  kun tekst: "og hører også til her" hedder nu "og har også et eksemplar her", og
          hjælpen forklarer forskellen på de to steder og på de to sammenlignende funktioner
   1.8.3  kun tekst: vejledningerne er eksempler, ikke forskrifter – ingen antagelser om hvad
          brugeren vil opnå
   1.8.4  panelet foldede "Afgræns materialerne" sammen og sprang til toppen, hver gang det blev
          tegnet om (sortering, gemte opsætninger, valg af felt). Nu bevares både åbne afsnit,
          søgefelter i lange lister og rullepositionen
   1.9.0  klassifikation kan afgrænses til et interval, fx 64 til 64.12 eller 99.1 til 99.94
   1.9.1  changelog.html i samme udseende som værktøjet, med hver udgave foldet sammen
   1.10.0 filens alder læses af filens ændret-tidspunkt og vises på filkortet, i topbjælken og
          på hyldelisten; gul fra 24 timer, rød fra 3 døgn
   1.10.1 alderen regnes i kalenderdage, ikke i døgn: mandag til onsdag er 2 dage
   1.11.0 fjerde funktion: Fjernlån. Egen filplads til fjernlånseksporten, tre visninger
          (titler, forfattere, ord), sammenligning med samlingen når den også er lagt op
   1.12.0 forsiden er lagt om: overskrift og filer side om side, opgaverne som kort i et gitter,
          grundopsætning og beskeder flyttet ned. Hver fil har sin egen aldersprik
   1.12.1 rettelse: ".loaded .ok" ramte også alderslinjen og de friske filprikker, så de blev
          tegnet som store cirkler
   1.13.0 leveår i forfatternavne ("f. 1968", "1947-") tæller ikke længere med, når to poster
          sammenlignes; Fjernlån viser hvilke afdelinger samlingsfilen dækker
   1.14.0 titler skrives forskelligt i fjernlånsposter og egne poster (" : " og parentes bagest);
          det udlignes nu. Nyt flueben "samme Mat. type" under Tæl inden for samme, slået til
          fra start. Grupper med flere materialetyper får et mærkat
   1.15.0 fjernlån matcher på titel alene når forfatteren mangler på den ene side (kan slås fra,
          og matchet er mærket i listen). Lange lister ruller i egen boks, Find og resultatets
          hoved bliver hængende, og der er en "Til toppen"-knap
   =================================================================== */

const VERSION = '1.15.0';
/* ---------------- kolonner ---------------- */
const ROLES = [
  { id:'plac',   label:'Placering',      req:true,  aliases:['placering','opstilling','lokation','location'] },
  { id:'titel',  label:'Titel',          req:true,  aliases:['titel','title'] },
  { id:'nr',     label:'Materialenr.',   req:true,  aliases:['materialenr','materialenummer','stregkode','barcode','itemid'] },
  { id:'status', label:'Status',         req:true,  aliases:['status'] },
  { id:'forf',   label:'Forfatter',      req:false, aliases:['forfatter','author','ophav'] },
  { id:'type',   label:'Mat. type',      req:false, aliases:['mattype','materialetype','type'] },
  { id:'gruppe', label:'Materialegruppe',req:false, aliases:['materialegruppe','matgruppe','gruppe'] },
  { id:'klass',  label:'Klassifikation', req:false, aliases:['klassifikation','dk5','klasse','classification'] },
];
function normHeader(h){ return String(h||'').toLowerCase().replace(/[^a-zæøå0-9]/g,''); }
function autoMap(headers){
  const map = {}; const used = new Set();
  for (const r of ROLES){
    for (const h of headers){
      if (used.has(h)) continue;
      const n = normHeader(h);
      if (!n) continue;
      if (r.aliases.some(a => n === a || n.startsWith(a))){ map[r.id] = h; used.add(h); break; }
    }
  }
  return map;
}

/* ---------------- tekst ---------------- */
function norm(s){ return String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim(); }
function titleCase0(s){ return String(s||'').trim(); }

// Titelnøgle: stamme + de undertitler, der ikke er genre/format/udgave/bind. "Ved …"/"Ill. …" beholdes (kan være forskellige udvalg). Bindnumre trækkes ud uanset notation.
const VOL_WORDS = '(?:bind|bd|bog|del|vol|volume|part|book|nr|no|sæson|season|disc|disk|hæfte)';
const RE_NUM_WORD = new RegExp('\\[?\\s*(\\d{1,4})\\s*\\.?\\s*\\]?\\s*\\.?\\s*\\[?\\s*\\b' + VOL_WORDS + '\\b\\.?\\s*\\]?', 'gi');
const RE_WORD_NUM = new RegExp('\\[?\\s*\\b' + VOL_WORDS + '\\b\\.?\\s*\\]?\\s*\\.?\\s*\\[?\\s*(\\d{1,4})\\s*\\]?', 'gi');
const RE_YEAR = /\((\d{4})\b/;
const RE_BARE_NUM = /^\[?\s*(\d{1,4})\s*\]?$/;
// undertitler, der beskriver samme værk (genre, format, storskriftserie) – fjernes
const GENERIC = new Set(['roman','romaner','en roman','krimi','en krimi','kriminalroman','en kriminalroman','spændingsroman','en spændingsroman','thriller','en thriller','krimithriller','psykologisk thriller','erindringsroman','kortroman','noveller','en novelle','novelle','novellesamling','digte','digtsamling','erindringer','biografi','en biografi','selvbiografi','fortællinger','fortælling','en fortælling','essays','essay','eventyr','skuespil','dagbog','breve','en kærlighedshistorie','en roman om en forbrydelse','en antologi','antologi','a novel','novel','stories','poems','a memoir','memoir','a thriller','mp3','lydbog','stor skrift','storskrift','magnaprintserien','magnumbøger','magnaprint','modtryks storskriftserie','storskriftserie','let læst','letlæst']);
const RE_EDITION = /^(nyoversat udgave|moderne retskrivning|ny retskrivning|\d+\. (rev\.? )?(udg|udgave|oplag)\.?)$/i;
function takeMarks(seg, marks, nums){
  const found=[]; let m;
  RE_NUM_WORD.lastIndex=0; while((m=RE_NUM_WORD.exec(seg))) found.push({i:m.index, e:m.index+m[0].length, txt:m[0], n:+m[1]});
  RE_WORD_NUM.lastIndex=0; while((m=RE_WORD_NUM.exec(seg))){ const i=m.index, e=i+m[0].length; if (found.some(x=> i<x.e+1 && e>x.i)) continue; found.push({i, e, txt:m[0], n:+m[1]}); }
  found.sort((a,b)=>a.i-b.i);
  for (const x of found){ marks.push(x.txt.replace(/[\[\]]/g,'').trim()); nums.push(x.n); }
  let rest = seg; for (const x of found.slice().reverse()) rest = rest.slice(0,x.i)+' '+rest.slice(x.e);
  return rest.replace(/\(\s*\d{4}\s*,?\s*\)/,'').replace(/[\[\]]/g,'').replace(/^[\s,.;–-]+|[\s,.;–-]+$/g,'').replace(/\s+/g,' ');
}
// Fjernlånsposter skrives anderledes end egne poster: "Titel : undertitel" med mellemrum om
// kolon, og tilføjelser i parentes bagest, "(Ved Tine Roesen)", hvor egne poster bruger kolon.
const RE_HALE = /\s*\(([^()]*)\)\s*$/;
function tidyTitle(t){
  t = String(t||'').trim();
  const m = RE_HALE.exec(t);
  if (m && !/^\s*\d{4}/.test(m[1])) t = t.slice(0, m.index) + ': ' + m[1];   // årstal beholdes i parentes
  return t.replace(/\s*:\s*/g, ': ').trim();
}
function titleKey(title){
  const t = tidyTitle(title);
  const segs = t.split(':').map(s=>s.trim()).filter(Boolean);
  if (!segs.length) return { key:'', stem:t, marks:[], nums:[], year:null };
  const marks=[], nums=[]; const keep=[];
  const first = takeMarks(segs[0], marks, nums) || segs[0];
  for (const seg of segs.slice(1)){
    const bare = RE_BARE_NUM.exec(seg); if (bare){ nums.push(+bare[1]); marks.push(bare[1]); continue; }
    const before = marks.length;
    const rest = takeMarks(seg, marks, nums);
    if (!rest) continue;                                   // kun bindangivelse
    if (marks.length > before){ keep.push(rest); continue; } // bind + tekst: behold teksten
    const low = norm(seg);
    if (GENERIC.has(low) || RE_EDITION.test(low)) continue;
    keep.push(seg);
  }
  const y = RE_YEAR.exec(t); const year = y ? +y[1] : null;
  const stem = [first, ...keep].join(': ');
  const key = norm(stem).replace(/[.,;!?]+$/,'') + (nums.length ? '#'+nums.join('.') : '') + (year ? '@'+year : '');
  return { key, stem, marks, nums, year };
}

// Leveår og lignende tilføjelser i forfatternavnet ("Slot Christiansen, Karin, f. 1968",
// "Aagaard, Peter, 1947-", "d. 1992", "ca. 1450") skelner to forfattere med samme navn i DBC's
// katalog. Til sammenligning af to poster er de støj – titlen skelner dem alligevel.
const RE_LIVSAAR = /,\s*(?:f\.|født|d\.|død|ca\.|c\.|\(?\d{3,4}\s*-\s*\d{0,4}\)?|\d{3,4})[^,]*$/i;
function authorKey(forf){
  let a = norm(forf), prev = null;
  while (a !== prev){ prev = a; a = a.replace(RE_LIVSAAR, '').trim().replace(/[.,;]+$/,''); }
  return a;
}

/* ---------------- model ---------------- */
const LEVEL_NAME_SETS = { 1:['Placering'], 2:['Filial','Opstilling'], 3:['Filial','Afdeling','Opstilling'], 4:['Filial','Afdeling','Opstilling','Delopstilling'], 5:['Filial','Afdeling','Sektion','Opstilling','Delopstilling'] };
function defaultLevelNames(maxLv){ return LEVEL_NAME_SETS[maxLv] ? LEVEL_NAME_SETS[maxLv].slice() : Array.from({length:maxLv},(_,i)=>'Niveau '+(i+1)); }
function parseRecs(rows, map){
  const recs = []; let maxLv = 1;
  for (const r of rows){
    const plac = titleCase0(r[map.plac]);
    if (!plac && !r[map.titel] && !r[map.nr]) continue; // tom linje
    const parts = plac.split('/').map(s=>s.trim());
    if (parts.length > maxLv) maxLv = parts.length;
    const tk = titleKey(r[map.titel]);
    const forf = titleCase0(map.forf ? r[map.forf] : '');
    recs.push({
      id: recs.length,
      plac, lv: parts,
      titel: titleCase0(r[map.titel]),
      nr: titleCase0(r[map.nr]),
      status: titleCase0(r[map.status]),
      forf,
      type: titleCase0(map.type ? r[map.type] : ''),
      gruppe: titleCase0(map.gruppe ? r[map.gruppe] : ''),
      klass: titleCase0(map.klass ? r[map.klass] : ''),
      tkey: tk.key, stem: tk.stem, marks: tk.marks,
      akey: authorKey(forf),
    });
  }
  for (const x of recs){
    if (maxLv === 5 && x.lv.length === 4) x.lv.splice(2, 0, '');   // Sektion mangler → tom sektion, ikke tom delopstilling
    while (x.lv.length < maxLv) x.lv.push('');
  }
  return { recs, maxLv };
}
function modelFrom(recs, maxLv, hasForf){
  const levelNames = defaultLevelNames(maxLv);
  const fields = {};
  const count = (getter) => { const m = new Map(); for (const x of recs){ const v = getter(x); m.set(v, (m.get(v)||0)+1); } return [...m.entries()].sort((a,b)=> b[1]-a[1] || String(a[0]).localeCompare(String(b[0]),'da')); };
  for (let i=0;i<maxLv;i++) fields['lv'+i] = { label: levelNames[i], values: count(x=>x.lv[i]) };
  fields.status = { label:'Status', values: count(x=>x.status) };
  fields.type   = { label:'Mat. type', values: count(x=>x.type) };
  fields.gruppe = { label:'Materialegruppe', values: count(x=>x.gruppe) };
  fields.klass  = { label:'Klassifikation', values: count(x=>x.klass) };
  return { recs, maxLv, levelNames, fields, hasForf };
}
function buildModel(rows, map){ const r = parseRecs(rows, map); return modelFrom(r.recs, r.maxLv, !!map.forf); }
function val(x, field){ return field.startsWith('lv') ? x.lv[+field.slice(2)] : x[field]; }

/* ---------------- filtre ---------------- */
// DK5: tallet forrest i klassemærket. "99.4 Ditlevsen, Tove" -> 99.4, "sk"/"te 83.8" -> null
const RE_DK5 = /^(\d+(?:\.\d+)?)/;
function dkCode(v){ const m = RE_DK5.exec(String(v||'').trim()); return m ? m[1] : ''; }
function dkNum(v){ const c = dkCode(String(v||'').replace(',', '.')); return c === '' ? null : parseFloat(c); }
// filters: { lv0:[...], lv1:[...], type:[...], gruppe:[...], klass:{mode:'is'|'starts'|'contains', text:''} }
function applyFilters(recs, filters){
  const fl = [];
  for (const [f, v] of Object.entries(filters||{})){
    if (f === 'klass'){
      const mode = (v && v.mode) || 'is';
      if (mode === 'between'){
        const a = dkNum(v.from), b = dkNum(v.to);
        if (a === null && b === null) continue;
        const toCode = String(v.to||'').trim().replace(',', '.');
        fl.push(x => {
          const n = dkNum(x.klass); if (n === null) return false;
          if (a !== null && n < a) return false;
          if (b !== null && n > b){
            const c = dkCode(x.klass);            // 64.125 hører under 64.12
            if (!(toCode && c.startsWith(toCode))) return false;
          }
          return true;
        });
        continue;
      }
      const t = norm(v && v.text); if (!t) continue;
      fl.push(x => { const k = norm(x.klass); return mode==='is' ? k===t : mode==='starts' ? k.startsWith(t) : k.includes(t); });
    } else if (Array.isArray(v) && v.length){
      const set = new Set(v); fl.push(x => set.has(val(x,f)));
    }
  }
  if (!fl.length) return recs;
  return recs.filter(x => fl.every(fn => fn(x)));
}
function groupBy(recs, groupLevels, useForf, useType){
  const m = new Map();
  for (const x of recs){
    let k = (useForf ? x.akey : '') + '|' + x.tkey + (useType ? '|'+norm(x.type) : '');
    for (const l of (groupLevels||[])) k += '|' + x.lv[l];
    let g = m.get(k); if (!g){ g = { k, items:[] }; m.set(k,g); }
    g.items.push(x);
  }
  return [...m.values()];
}

function readFiles(files, append){

  S.files = append ? S.files.concat(files.map(f=>f.name)) : files.map(f=>f.name);
  S.fileTimes = append ? S.fileTimes.concat(stamps) : stamps;
  S.fileCount = S.files.length;
  S.fileName = S.files.length===1 ? S.files[0] : `${S.files.length} filer`;
  toast(files.length===1 ? 'Læser filen…' : `Læser ${files.length} filer…`);
  let headers = append ? S.headers : null; const rows = append ? S.rows.slice() : []; const mismatched = [];
  const next = (i) => {
    if (i >= files.length){
      if (!rows.length){ S.error='Filerne ser tomme ud, eller de kunne ikke læses som CSV.'; S.rows=null; render(); return; }
      if (mismatched.length) S.warn = `${mismatched.length} ${mismatched.length===1?'fil har':'filer har'} andre kolonner end den første og er sprunget over: ${mismatched.join(', ')}.`;
      S.headers = headers; S.rows = rows; S.map = autoMap(S.headers); finishLoad(); return;
    }
    Papa.parse(files[i], { header:true, skipEmptyLines:true, encoding:'UTF-8',
      complete: res => {
        const h = (res.meta.fields||[]).filter(x=>x!==undefined);
        if (!headers){ headers = h; }
        else if (h.join('\u0001') !== headers.join('\u0001')){ mismatched.push(files[i].name); next(i+1); return; }
        for (const r of res.data) rows.push(r);
        next(i+1);
      },
      error: err => { S.error='Filen '+files[i].name+' kunne ikke læses: '+err.message; render(); }
    });
  };
  next(0);
}

function buildIll(recs){
  const seen = new Set(); const uniq = [];
  for (const x of recs){ if (x.nr && seen.has(x.nr)) continue; if (x.nr) seen.add(x.nr); uniq.push(x); }
  const works = new Map();
  for (const x of uniq){
    const k = x.akey + '|' + x.tkey;
    let w = works.get(k);
    if (!w){ w = { k, forf:x.forf, titel:x.titel, stem:x.stem, akey:x.akey, tkey:x.tkey, n:0, types:new Map(), grupper:new Map() }; works.set(k,w); }
    w.n++;
    if (x.type) w.types.set(x.type,(w.types.get(x.type)||0)+1);
    if (x.gruppe) w.grupper.set(x.gruppe,(w.grupper.get(x.gruppe)||0)+1);
    if (!w.forf && x.forf) w.forf = x.forf;
  }
  const types = new Map();
  for (const x of uniq){ const t = x.type || ''; types.set(t,(types.get(t)||0)+1); }
  S.ill = { recs:uniq, works, count:uniq.length,
            types:[...types.entries()].sort((a,b)=>b[1]-a[1]) };
}

function ownIndex(){
  if (!S.model) return null;
  if (S._own && S._ownFor === S.model) return S._own;
  const works = new Map(), authors = new Map(), byTitle = new Map();
  for (const x of S.model.recs){
    const k = x.akey + '|' + x.tkey;
    works.set(k, (works.get(k)||0)+1);
    let t = byTitle.get(x.tkey);
    if (!t){ t = { n:0, akeys:new Set() }; byTitle.set(x.tkey, t); }
    t.n++; t.akeys.add(x.akey);
    if (x.akey){ let a = authors.get(x.akey); if (!a){ a = {ex:0, titler:new Set()}; authors.set(x.akey,a); } a.ex++; a.titler.add(x.tkey); }
  }
  S._own = { works, authors, byTitle }; S._ownFor = S.model; return S._own;
}
// Forfatterfeltet er tomt i mange lokale poster (ophavet står i MARC-felt 700, ikke 100),

function ownCount(own, w, joker){
  const exact = own.works.get(w.akey + '|' + w.tkey);
  if (exact !== undefined) return { n: exact, joker: false };
  if (joker){
    const t = own.byTitle.get(w.tkey);
    if (t && (!w.akey || t.akeys.has(''))) return { n: t.n, joker: true };
  }
  return { n: 0, joker: false };
}
function finishLoad(){
  if (missingRoles().length){ S.model=null; render(); return; }
  S.full = parseRecs(S.rows, S.map);
  { const byNr = new Map(); const uniq = []; const dupNrs = new Set(); let d = 0;
    for (const x of S.full.recs){
      if (!x.nr){ uniq.push(x); continue; }
      const prev = byNr.get(x.nr);
      if (prev === undefined){ byNr.set(x.nr, uniq.length); uniq.push(x); continue; }
      d++; dupNrs.add(x.nr);
      if (uniq[prev].status === 'Hjemme' && x.status !== 'Hjemme') uniq[prev] = x;   // bogen er ikke på hylden – behold den række, der siger det
    }
    S.full.recs = uniq; S.dupes = d; S.dupeNrs = [...dupNrs]; uniq.forEach((x,i)=>x.id=i); }
  S.chipSort = load('chipsort',{});
  S.base = sanitizeBase(load('base',{}));
  applyBase();
  const bad = S.model.recs.filter(x=>!x.nr).length;
  if (bad) S.warn = nf(bad)+' rækker uden materialenummer er sprunget over ved eksport.';
  if (S.dupes) S.warn += (S.warn?' ':'')+nf(S.dupeNrs.length)+(S.dupeNrs.length===1?' materiale stod':' materialer stod')+' to gange i filen, formentlig fordi de skiftede status, mens udtrækket blev lavet. Kun én række er talt med.';
  if (!S.map.forf) S.warn += (S.warn?' ':'')+'Ingen forfatterkolonne fundet – der grupperes kun på titel.';
  S.results=null; S.checked=new Set(); S.open=new Set();
  render();
}

/* ---------- grundopsætning ---------- */
function sanitizeBase(b){
  const out = {}; if (!b || !S.full) return out;
  for (let i=0;i<S.full.maxLv;i++){ const have = new Set(S.full.recs.map(x=>x.lv[i])); const ex = (b['lv'+i]||[]).filter(v=>have.has(v)); if (ex.length) out['lv'+i]=ex; }
  return out;
}
function applyBase(){
  const ex = []; for (let i=0;i<S.full.maxLv;i++){ const l=S.base['lv'+i]; if (l && l.length) ex.push([i,new Set(l)]); }
  const active = ex.length ? S.full.recs.filter(x => !ex.some(([i,set]) => set.has(x.lv[i]))) : S.full.recs;
  S.model = modelFrom(active, S.full.maxLv, !!S.map.forf);
  S.model.fullCount = S.full.recs.length; S.model.excluded = S.full.recs.length - active.length;
}
function baseView(){
  const fullModel = modelFrom(S.full.recs, S.full.maxLv, !!S.map.forf);
  const parts = fullModel.levelNames.map((n,i)=>{
    const vals = sortVals('lv'+i, 'base_lv'+i, fullModel.fields['lv'+i].values); if (vals.length===1 && vals[0][0]==='') return '';
    const ex = new Set(S.base['lv'+i]||[]);
    const chips = vals.map(([v,c]) => `<label class="chip ${ex.has(v)?'':'on'}"><input type="checkbox" name="base_lv${i}" value="${esc(v)}" ${ex.has(v)?'':'checked'}> ${esc(disp(v))} <span class="n">${nf(c)}</span></label>`).join('');
    return `<div class="lvl"><div class="lvlhead"><b>${esc(n)}</b>${vals.length>1?sortTools('lv'+i,'base_lv'+i):''}</div><div class="chipbox" data-name="base_lv${i}"><div class="chips">${chips}</div><div class="chips-tools"><button data-act="allchips">Vælg alle</button><button data-act="nochips">Fravælg alle</button></div></div></div>`;
  }).join('');
  return `<details class="base" ${S.baseOpen?'open':''}><summary><span>Grundopsætning</span><span class="hint">${S.model.excluded ? nf(S.model.excluded)+' materialer fravalgt' : 'alt er med'}</span><span class="chev">${ICON.chev}</span></summary>
    <div class="body"><p class="muted small">Fravælg de steder, der aldrig skal med – fx et arkiv eller tomme filialer. Valget huskes i denne browser og gælder alle opgaver.</p><div class="levelgrid">${parts}</div></div></details>`;
}

function fileLevel(ms){
  if (!ms) return null;
  const days = Math.round((dayStart(Date.now()) - dayStart(ms)) / DAY);
  return { days, level: days >= 3 ? 'rod' : days >= 1 ? 'gul' : 'ok' };
}
function fileChips(names, times){
  return names.map((f,i)=>{
    const l = fileLevel(times[i]);
    const title = l ? `${f} · trukket ${whenText(times[i])}` : `${f} · uden tidsstempel`;
    const mark = !l ? '<span class="fdot none">?</span>' : l.level==='ok' ? '<span class="fdot ok"></span>' : `<span class="fdot ${l.level}">!</span>`;
    return `<span class="fchip" title="${esc(title)}">${mark}${esc(f)}</span>`;
  }).join('');
}

const COL = new Intl.Collator('da', {numeric:true, sensitivity:'base'});
const ABC_FIRST = new Set(['Delopstilling','Mat. type']);
function sortKey(name){ return 'sort:'+name; }
function chipSort(field, name){
  const saved = S.chipSort[name];
  if (saved) return saved;
  const label = (S.model.fields[field]||{}).label || '';
  return { mode: ABC_FIRST.has(label) ? 'abc' : 'antal', dir: 1 };
}
function sortVals(field, name, vals){
  const c = chipSort(field, name); const out = vals.slice();
  out.sort(c.mode==='abc'
    ? (a,b)=> COL.compare(disp(a[0]), disp(b[0]))
    : (a,b)=> b[1]-a[1] || COL.compare(disp(a[0]), disp(b[0])));
  if (c.dir < 0) out.reverse();
  return out;
}
function sortTools(field, name){
  const c = chipSort(field, name);
  return `<span class="sorttools"><button data-act="sortmode" data-n="${esc(name)}" data-f="${esc(field)}" title="Skift mellem alfabetisk og efter antal">${c.mode==='abc'?'A–Å':'Antal'}</button><button data-act="sortdir" data-n="${esc(name)}" data-f="${esc(field)}" title="Vend rækkefølgen om">${c.dir>0?'↓':'↑'}</button></span>`;
}
function chipList(field, selected, name, opts={}){
  const vals = sortVals(field, name, S.model.fields[field].values); const sel = new Set(selected||[]);
  const many = vals.length > 15; const col = !!opts.collapsible && !S.chipOpen.has(name); const long = vals.length > 12;
  const chips = vals.map(([v,n]) => `<label class="chip ${sel.has(v)?'on':''} ${col&&!sel.has(v)?'hid':''}" data-v="${esc(v)}"><input type="checkbox" name="${name}" value="${esc(v)}" ${sel.has(v)?'checked':''}> ${esc(disp(v))} <span class="n">${nf(n)}</span></label>`).join('');
  const unit = opts.unit || 'værdier';
  return `<div class="chipbox ${col?'collapsed':''} ${long?'long':''}" data-name="${name}">${vals.length>1?`<div class="chips-top when-open">${sortTools(field,name)}</div>`:''}${many?`<input class="chips-filter" placeholder="Søg i ${vals.length} ${unit}…">`:''}<div class="chips">${col&&!sel.size&&opts.showAll!==false?`<span class="muted small when-closed">Alle</span>`:''}${chips}</div>
    <div class="chips-tools"><button class="when-open" data-act="allchips">Vælg alle</button><button class="when-open" data-act="nochips">Fravælg alle</button>${opts.note?`<span class="muted">${opts.note}</span>`:''}</div>${opts.collapsible?`<button class="cb-toggle" data-act="togglechips" data-open="${esc(opts.expandLabel || `Vis alle ${vals.length} ${unit}`)}">${col?(opts.expandLabel || `Vis alle ${vals.length} ${unit}`):'Skjul'}</button>`:''}</div>`;
}

/* læs indstillinger fra panelet */
function readIllPanel(){
  const p = document.getElementById('panel'); const s = curSettings();
  s.min = Math.max(1, parseInt(p.querySelector('input[name="illmin"]').value)||1);
  const o = p.querySelector('input[name="illown"]:checked'); s.own = o ? o.value : 'alle';
  const om = p.querySelector('input[name="illownmax"]'); if (om) s.ownMax = Math.max(0, parseInt(om.value)||0);
  const jk = p.querySelector('input[name="illjoker"]'); if (jk) s.joker = jk.checked;
  s.types = [...p.querySelectorAll('input[name="illtype"]:checked')].map(i=>i.value);
  const mw = p.querySelector('input[name="illminword"]'); if (mw) s.minWord = Math.max(5, parseInt(mw.value)||5);
  const st = p.querySelector('textarea[name="stopord"]');
  if (st) store('stopord', st.value.split(/[\s,;]+/).map(w=>w.trim()).filter(Boolean));
  store('last:'+S.fn, s);
}
function readPanel(){
  if (FUNCTIONS[S.fn].custom) return readIllPanel();
  const p = document.getElementById('panel'); const s = curSettings();
  const vals = name => [...p.querySelectorAll(`input[name="${name}"]:checked`)].map(i=>i.value);
  s.statuses = vals('status');
  s.groupLevels = vals('groupLevel').map(Number);
  const uf = p.querySelector('input[name="useForf"]'); s.useForf = uf ? uf.checked : true;
  const ut = p.querySelector('input[name="useType"]'); s.useType = ut ? ut.checked : true;
  if (S.fn==='flere'){ s.min = Math.max(2, parseInt(p.querySelector('input[name="min"]').value)||2); }
  else {
    for (const k of ['A','B']){ const f = p.querySelector(`select[name="${k}_field"]`).value; s['side'+k] = { field:f, values: f ? vals(k+'_val') : [] }; }
    const ew = p.querySelector('input[name="exportWhat"]:checked'); s.exportWhat = ew ? ew.value : 'A';
  }
  const fl = {};
  fl.type = vals('f_type'); fl.gruppe = vals('f_gruppe');
  S.model.levelNames.forEach((n,i)=>{ fl['lv'+i] = vals('f_lv'+i); });
  const km = (p.querySelector('select[name="f_klass_mode"]')||{}).value||'is';
  fl.klass = km==='between'
    ? { mode:'between', text:'', from: ((p.querySelector('input[name="f_klass_from"]')||{}).value||'').trim(), to: ((p.querySelector('input[name="f_klass_to"]')||{}).value||'').trim() }
    : { mode: km, text: ((p.querySelector('input[name="f_klass_text"]')||{}).value||'').trim(), from:'', to:'' };
  s.filters = fl;
  store('last:'+S.fn, s);
}
function sanitize(s, fn){
  const m=S.model; const d = FUNCTIONS[fn].defaults(m); if (!s) return d;
  const have = f => new Set((m.fields[f]||{values:[]}).values.map(v=>v[0]));
  const keep = (f, arr) => Array.isArray(arr) ? arr.filter(v=>have(f).has(v)) : [];
  const out = { ...d, ...s };
  out.statuses = keep('status', s.statuses); if (!out.statuses.length) out.statuses = d.statuses;
  out.groupLevels = (s.groupLevels||[]).filter(i=>i<m.maxLv);
  const fl = {}; for (const [k,v] of Object.entries(s.filters||{})){ if (k==='klass') fl.klass=v; else if (m.fields[k]) fl[k]=keep(k,v); }
  out.filters = fl;
  for (const k of ['sideA','sideB']){ if (out[k]){ const f=out[k].field; out[k] = (f && m.fields[f]) ? {field:f, values:keep(f,out[k].values)} : {field:'',values:[]}; } }
  return out;
}

function sortGroups(R){
  const c = new Intl.Collator('da'); const first = g => g.hits[0]||g.items[0];
  const by = {
    forf: (a,b)=> c.compare(first(a).forf||'\uffff', first(b).forf||'\uffff') || c.compare(first(a).stem, first(b).stem),
    titel:(a,b)=> c.compare(first(a).stem, first(b).stem),
    antal:(a,b)=> b.hits.length-a.hits.length || c.compare(first(a).forf, first(b).forf),
    plac: (a,b)=> c.compare(first(a).plac, first(b).plac) || c.compare(first(a).forf, first(b).forf),
  };
  return R.slice().sort(by[S.sort]||by.forf);
}

      <div class="cnt">${g.hits.length}<small>${nSel} valgt</small></div></div>

/* ---------- handlinger ---------- */
function illRun(){
  readIllPanel();
  const s = curSettings(); const own = ownIndex();
  const typeSet = new Set(s.types||[]);
  const keep = w => !typeSet.size || [...w.types.keys()].some(t=>typeSet.has(t));
  const ownOf = w => own ? ownCount(own, w, s.joker!==false) : null;
  const passOwn = c => !own || s.own==='alle' || (s.own==='ingen' ? c===0 : c<=s.ownMax);
  let rows = [], note = '';
  if (S.illTab === 'titler'){
    for (const w of S.ill.works.values()){
      if (w.n < s.min || !keep(w)) continue;
      const c = ownOf(w); if (!passOwn(c ? c.n : null)) continue;
      const t = [...w.types.entries()].sort((a,b)=>b[1]-a[1])[0];
      rows.push({ forf:w.forf, titel:w.titel, n:w.n, own:c?c.n:null, joker:!!(c&&c.joker), type: t?t[0]:'' });
    }
    rows.sort((a,b)=> b.n-a.n || (a.forf||'').localeCompare(b.forf||'','da'));
    note = `· ${nf(rows.reduce((a,r)=>a+r.n,0))} fjernlån i alt`;
  } else if (S.illTab === 'forfattere'){
    const by = new Map();
    for (const w of S.ill.works.values()){
      if (!w.akey || !keep(w)) continue;
      let a = by.get(w.akey); if (!a){ a = { forf:w.forf, n:0, works:0 }; by.set(w.akey,a); }
      a.n += w.n; a.works++;
    }
    for (const [akey,a] of by){
      if (a.n < s.min) continue;
      const o = own ? own.authors.get(akey) : null;
      const ownT = o ? o.titler.size : 0, ownEx = o ? o.ex : 0;
      if (own && !(s.own==='alle' || (s.own==='ingen' ? ownEx===0 : ownEx<=s.ownMax))) continue;
      rows.push({ forf:a.forf, n:a.n, works:a.works, ownT, ownEx });
    }
    rows.sort((a,b)=> b.n-a.n || a.forf.localeCompare(b.forf,'da'));
    note = '· tæller alle værker af forfatteren under ét';
  } else {
    if (!own) return { error:'Ordanalysen kræver, at samlingen også er lagt op på forsiden.' };
    const stop = stopSet();
    const cf = new Map(), cv = new Map();
    for (const w of S.ill.works.values()){ if (!keep(w)) continue;
      for (const word of titleWords(w.titel, stop)) cf.set(word,(cf.get(word)||0)+w.n); }
    const seenTitle = new Set();
    for (const x of S.model.recs){ const k = x.akey+'|'+x.tkey; if (seenTitle.has(k)) continue; seenTitle.add(k);
      for (const word of titleWords(x.titel, stop)) cv.set(word,(cv.get(word)||0)+1); }
    let tf=0, tv=0; for (const n of cf.values()) tf+=n; for (const n of cv.values()) tv+=n;
    for (const [w,n] of cf){
      if (n < s.minWord) continue;
      const o = cv.get(w)||0;
      const lift = (n/tf) / ((o+1)/tv);
      rows.push({ w, n, own:o, lift });
    }
    rows.sort((a,b)=> b.lift-a.lift);
    note = '· sorteret efter hvor meget ordet fylder i fjernlånene i forhold til jeres egne titler';
  }
  return { rows, note };
}
function run(){
  if (FUNCTIONS[S.fn].custom){
    const r = illRun(); S.results = r; S.shown = 100;
    const el = document.getElementById('results'); el.innerHTML = resultsView();
    if (!r.error) toast(r.rows.length ? `${nf(r.rows.length)} fundet` : 'Ingenting matcher');
    return;
  }
  readPanel(); S.error='';
  const r = FUNCTIONS[S.fn].run(S.model, curSettings());
  if (r && r.error){ S.error=r.error; S.results=null; }
  else { S.results=r; S.checked=new Set(r.flatMap(g=>g.exp.map(x=>x.id))); S.open=new Set(); S.shown=150; }
  const el = document.getElementById('results'); el.innerHTML = resultsView(); if (window.innerWidth<860) el.scrollIntoView({behavior:'smooth'});
  if (!S.error) toast(S.results.length ? `${nf(S.results.length)} titler fundet` : 'Ingen titler matcher');
}
function checkedItems(){ const ids=S.checked; return S.results.flatMap(g=>g.exp.filter(x=>ids.has(x.id))); }
function downloadLines(lines, name){
  const blob = new Blob([lines.join('\r\n')+'\r\n'], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function illRowsForOutput(){
  const R = S.results; if (!R || !R.rows) return null;
  const own = ownIndex();
  if (S.illTab==='ord') return { head:['Ord','Fjernlån','Egne titler','Overrepræsentation'], rows:R.rows.map(r=>[r.w,r.n,r.own,(Math.round(r.lift*10)/10)+'x']) };
  if (S.illTab==='forfattere') return { head:['Forfatter','Fjernlån','Værker'].concat(own?['Egne titler','Egne eksemplarer']:[]), rows:R.rows.map(r=>[r.forf,r.n,r.works].concat(own?[r.ownT,r.ownEx]:[])) };
  return { head:['Forfatter','Titel','Type','Fjernlån'].concat(own?['Egne eksemplarer','Matchet uden forfatter']:[]), rows:R.rows.map(r=>[r.forf,r.titel,r.type,r.n].concat(own?[r.own, r.joker?'ja':'']:[])) };
}
function illCsv(){
  const d = illRowsForOutput(); if (!d) return;
  const q = v => { const t = String(v==null?'':v); return /[";\r\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; };
  const lines = [d.head.map(q).join(';')].concat(d.rows.map(r=>r.map(q).join(';')));
  downloadLines(lines, `hyldetjek-fjernlaan-${S.illTab}-${new Date().toISOString().slice(0,10)}.csv`);
  toast(`${nf(d.rows.length)} linjer hentet`);
}
function illPrint(){
  const d = illRowsForOutput(); if (!d) return;
  const s = curSettings(); const a = illAge();
  const titles = {titler:'Titler', forfattere:'Forfattere', ord:'Ord i titlerne'};
  let html = `<h1>Fjernlån: ${titles[S.illTab]}</h1><div class="pm">${new Date().toLocaleDateString('da-DK')} · ${esc(S.illFiles.join(', '))}${a?` (trukket ${esc(whenText(a.oldest))})`:''} · ${nf(d.rows.length)} linjer · mindst ${S.illTab==='ord'?s.minWord+' forekomster':s.min+' fjernlån'}</div>`;
  html += `<table><thead><tr>${d.head.map((h,i)=>`<th${i?' class="nr"':''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>`;
  for (const r of d.rows) html += `<tr>${r.map((c,i)=>`<td${i?' class="nr"':''}>${esc(c)}</td>`).join('')}</tr>`;
  html += '</tbody></table>';
  document.getElementById('print').innerHTML = html;
  window.print();
}
function exportCsv(){
  const items = checkedItems().filter(x=>x.nr);
  const seen = new Set(); const lines = []; for (const x of items){ if (!seen.has(x.nr)){ seen.add(x.nr); lines.push(x.nr); } }
  const blob = new Blob([lines.join('\r\n')+'\r\n'], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`hyldetjek-${S.fn}-${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast(`${nf(lines.length)} materialenumre hentet`);
}
function printList(){
  const items = checkedItems(); const c = new Intl.Collator('da');
  const ctx = new Map();
  for (const g of S.results){
    const chosen = g.exp.filter(x=>S.checked.has(x.id)); if (!chosen.length) continue;
    const placeOf = x => x.lv.filter(Boolean).join(' / ') || '(ingen placering)';
    for (const x of chosen){
      const here = g.hits.filter(y=>placeOf(y)===placeOf(x)).length;
      const others = new Map();
      for (const y of g.hits){
        if (placeOf(y)===placeOf(x)) continue;
        const diff = y.lv.filter((v,i)=> v && v!==x.lv[i]).join(' / ') || placeOf(y);
        others.set(diff, (others.get(diff)||0)+1);
      }
      const rest = [...others.entries()].map(([p,n])=>`${n} i ${p}`).join(', ');
      ctx.set(x.id, `${here} af ${g.hits.length}${rest?' · '+rest:''}`);
    }
  }
  items.sort((a,b)=> c.compare(a.plac,b.plac) || c.compare(a.forf||'\uffff', b.forf||'\uffff') || c.compare(a.stem,b.stem) || c.compare(a.titel,b.titel));
  const s = curSettings(); const f = FUNCTIONS[S.fn];
  const age = fileAge();
  let meta = `${new Date().toLocaleDateString('da-DK')} · ${esc(S.fileName)}${age?` (trukket ${esc(whenText(age.oldest))})`:''} · ${nf(items.length)} eksemplarer`;
  if (S.fn==='flere') meta += ` · mindst ${s.min} med status ${s.statuses.join('/')}`;
  let html = `<h1>Hyldeliste: ${esc(f.title)}</h1><div class="pm">${meta}</div>`;
  let cur = null;
  for (const x of items){
    const p = x.lv.filter(Boolean).join(' / ') || '(ingen placering)';
    if (p !== cur){ if (cur!==null) html += '</tbody></table>'; cur = p; html += `<h2>${esc(p)}</h2><table><thead><tr><th></th><th>Forfatter og titel</th><th>Hele titlen</th><th>Status</th><th>Materialenr.</th></tr></thead><tbody>`; }
    html += `<tr><td class="bx"><span></span></td><td>${x.forf?`<b>${esc(x.forf)}</b><br>`:''}${esc(x.titel)}</td><td class="ctx">${esc(ctx.get(x.id)||'')}</td><td>${esc(x.status)}</td><td class="nr">${esc(x.nr)}</td></tr>`;
  }
  if (cur!==null) html += '</tbody></table>';
  document.getElementById('print').innerHTML = html;
  window.print();
}

/* ---------- events ---------- */

  const top = document.getElementById('totop');

  addEventListener('scroll', ()=>{ if (tick) return; tick = true;

  $app.addEventListener('change', onChange);
  $app.addEventListener('input', onInput);
  ['dragenter','dragover'].forEach(ev=>$app.addEventListener(ev, e=>{ const d=e.target.closest('#drop, #illdrop'); if (d){ e.preventDefault(); d.classList.add('over'); } }));
  $app.addEventListener('dragleave', e=>{ const d=e.target.closest('#drop, #illdrop'); if (d) d.classList.remove('over'); });
  $app.addEventListener('drop', e=>{ const d=e.target.closest('#drop, #illdrop'); if (!d) return; e.preventDefault(); d.classList.remove('over');
    if (d.id==='illdrop') readIll(e.dataTransfer.files, !!S.ill); else readFiles(e.dataTransfer.files, !!S.model); });

}
function onClick(e){

  if (act==='applymap'){ const m={}; $app.querySelectorAll('select[data-role]').forEach(s=>{ if (s.value) m[s.dataset.role]=s.value; }); S.map=m; if (missingRoles().length){ toast('De fire første kolonner skal vælges'); return; } finishLoad(); return; }

    const k = b.dataset.k;

    if (existing){ existing.remove(); b.classList.remove('on'); return; }
    const sum = b.closest('summary');
    const anchor = sum || b.closest('h3') || b.closest('.radio') || b.parentElement;
    const d = document.createElement('p'); d.className='helptext'; d.dataset.k = k; d.textContent = HELP[k] || '';
    if (sum){ sum.parentElement.open = true; (sum.nextElementSibling || sum.parentElement).insertAdjacentElement(sum.nextElementSibling?'beforebegin':'beforeend', d); }
    else anchor.insertAdjacentElement('afterend', d);
    b.classList.add('on');
    return; }
  if (act==='sortmode'||act==='sortdir'){ e.preventDefault(); const n=b.dataset.n, f=b.dataset.f; const c={...chipSort(f,n)};

    S.chipSort[n]=c; const all=load('chipsort',{}); all[n]=c; store('chipsort',all);
    if (n.startsWith('base_')){ S.baseOpen=true; render(); } else { readPanel(); rerenderPanel(); }
    return; }
  if (act==='togglechips'){ e.preventDefault(); const box=b.closest('.chipbox'); const collapse = !box.classList.contains('collapsed'); const nm=box.dataset.name; if (collapse) S.chipOpen.delete(nm); else S.chipOpen.add(nm); b.textContent = collapse ? b.dataset.open : 'Skjul'; if (collapse){ box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('hid', !c.querySelector('input').checked)); const any=[...box.querySelectorAll('.chip input')].some(i=>i.checked); const alle=box.querySelector('.chips .when-closed'); if (alle) alle.style.display = any?'none':''; } box.classList.toggle('collapsed', collapse); return; }
  if (act==='allchips'||act==='nochips'){ e.preventDefault(); const box=b.closest('.chipbox'); box.querySelectorAll('input[type=checkbox]').forEach(i=>{ if (i.closest('.chip').style.display!=='none'){ i.checked = act==='allchips'; i.closest('.chip').classList.toggle('on', i.checked); } }); if ((box.dataset.name||'').startsWith('base_lv')) onBaseChange(); return; }
  if (act==='savepreset'){ const f=document.querySelector('.saveform'); const sel=document.querySelector('select[name="preset"]'); const mine=load('presets',[]).filter(p=>p.fn===S.fn); const cur = sel.value ? mine[+sel.value] : null; f.querySelector('input[name="presetName"]').value = cur ? cur.name : ''; f.querySelector('input[name="presetFav"]').checked = !!(cur && cur.fav); f.querySelector('input[name="presetFav"]').closest('.chip').classList.toggle('on', !!(cur&&cur.fav)); f.classList.remove('hidden'); f.querySelector('input[name="presetName"]').focus(); return; }
  if (act==='savecancel'){ document.querySelector('.saveform').classList.add('hidden'); return; }
  if (act==='savepreset2'){ const f=document.querySelector('.saveform'); const name=f.querySelector('input[name="presetName"]').value.trim(); if (!name){ toast('Giv indstillingen et navn'); return; } const fav=f.querySelector('input[name="presetFav"]').checked; readPanel(); const all=load('presets',[]); const i=all.findIndex(p=>p.fn===S.fn&&p.name===name); const p={name, fn:S.fn, settings:curSettings(), fav}; if (i>=0) all[i]=p; else all.push(p); store('presets',all); S.presetName=name; toast(fav?'Gemt – ligger nu på forsiden':'Gemt'); rerenderPanel(); return; }
  if (act==='reset' && FUNCTIONS[S.fn].custom){ S.settings[S.fn] = FUNCTIONS[S.fn].defaults(); S.results=null; try{ localStorage.removeItem('hyldetjek:last:'+S.fn); }catch(err){} rerenderPanel(); refreshResults(); toast('Nulstillet'); return; }
  if (act==='reset'){ S.settings[S.fn] = FUNCTIONS[S.fn].defaults(S.model); S.presetName=''; try{ localStorage.removeItem('hyldetjek:last:'+S.fn); }catch(e){} S.results=null; S.error=''; rerenderPanel(); refreshResults(); toast('Nulstillet'); return; }
  if (act==='fav'){ const p=load('presets',[]).find(x=>x.fn===b.dataset.fn && x.name===b.dataset.name); if (!p) return; S.fn=p.fn; S.view='tool'; S.results=null; S.error=''; S.settings[S.fn]=sanitize(p.settings, S.fn); S.presetName=p.name; render(); window.scrollTo(0,0); run(); return; }
  if (act==='delpreset'){ const sel=document.querySelector('select[name="preset"]'); if (!sel.value){ toast('Vælg først en gemt indstilling'); return; } const mine=load('presets',[]).filter(p=>p.fn===S.fn); const victim=mine[+sel.value]; if (!confirm(`Slet "${victim.name}"?`)) return; store('presets', load('presets',[]).filter(p=>!(p.fn===victim.fn&&p.name===victim.name))); if (S.presetName===victim.name) S.presetName=''; toast('Slettet'); rerenderPanel(); return; }
  if (act==='exportpresets'){ const all=load('presets',[]); if (!all.length){ toast('Der er ingen gemte indstillinger endnu'); return; } const blob=new Blob([JSON.stringify({hyldetjek:1, presets:all},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hyldetjek-indstillinger.json'; a.click(); return; }
  if (act==='importpresets'){ document.getElementById('presetFile').onchange = ev => { const f=ev.target.files[0]; if (!f) return; f.text().then(t=>{ try{ const j=JSON.parse(t); if (!j||!Array.isArray(j.presets)) throw 0; const all=load('presets',[]); let n=0; for (const p of j.presets){ if (!p.fn||!p.name||!FUNCTIONS[p.fn]) continue; const i=all.findIndex(q=>q.fn===p.fn&&q.name===p.name); if (i>=0) all[i]=p; else all.push(p); n++; } store('presets',all); toast(`${n} indstillinger hentet`); rerenderPanel(); }catch(err){ toast('Filen er ikke en indstillingsfil fra Hyldetjek'); } }); }; document.getElementById('presetFile').click(); return; }
  if (act==='toggle'){ if (e.target.closest('input')) return; const k=b.closest('.grp').dataset.k; S.open.has(k)?S.open.delete(k):S.open.add(k); b.closest('.grp').classList.toggle('open'); return; }
  if (act==='openall'||act==='closeall'){ const all=act==='openall'; S.open = all ? new Set(S.results.map(g=>g.k)) : new Set(); document.querySelectorAll('.grp').forEach(g=>g.classList.toggle('open',all)); return; }
  if (act==='selall'||act==='selnone'){ S.checked = act==='selall' ? new Set(S.results.flatMap(g=>g.exp.map(x=>x.id))) : new Set(); refreshResults(); return; }

  if (act==='illcsv'){ illCsv(); return; }

  if (act==='print'){ printList(); return; }
}
function onBaseChange(){
  const b = {};
  for (let i=0;i<S.full.maxLv;i++){ const ex=[...$app.querySelectorAll(`input[name="base_lv${i}"]:not(:checked)`)].map(x=>x.value); if (ex.length) b['lv'+i]=ex; }
  S.base = b; store('base', b); S.baseOpen = true; applyBase(); S.results=null; render();
}
function refreshResults(){ const el=document.getElementById('results'); const y=window.scrollY; el.innerHTML=resultsView(); window.scrollTo(0,y); }
function rerenderPanel(){
  const panel = document.getElementById('panel');
  const openSecs = [...panel.querySelectorAll('details.sec')].map(d=>d.open);
  const filters = {}; panel.querySelectorAll('.chipbox').forEach(b=>{ const f=b.querySelector('.chips-filter'); if (f && f.value) filters[b.dataset.name]=f.value; });
  const helps = [...panel.querySelectorAll('.helptext')].map(h=>h.dataset.k);
  const y = window.scrollY;
  panel.innerHTML = panelView();
  panel.querySelectorAll('details.sec').forEach((d,i)=>{ if (openSecs[i]!==undefined) d.open = openSecs[i]; });
  for (const [name,val] of Object.entries(filters)){ const f = panel.querySelector(`.chipbox[data-name="${name}"] .chips-filter`); if (f){ f.value = val; f.dispatchEvent(new Event('input', {bubbles:true})); } }

function onChange(e){
  const t = e.target;
  if (t.matches('#illInput, #illInput2')){ const fs=[...t.files]; if (fs.length) readIll(fs, t.id==='illInput'); t.value=''; return; }
  if (t.matches('input[type=file]') && t.id!=='presetFile'){ const fs=[...t.files]; if (fs.length) readFiles(fs, t.dataset.mode==='append'); t.value=''; return; }
  if (t.matches('.chip input')){ t.closest('.chip').classList.toggle('on', t.checked); if (t.name.startsWith('base_lv')) onBaseChange(); return; }
  if (t.matches('select[name="f_klass_mode"]')){ readPanel(); rerenderPanel(); return; }
  if (t.matches('select[name="A_field"], select[name="B_field"]')){ readPanel(); rerenderPanel(); return; }
  if (t.matches('select[name="preset"]')){ if (!t.value) return; const mine=load('presets',[]).filter(p=>p.fn===S.fn); const p=mine[+t.value]; if (p){ S.settings[S.fn]=sanitize(p.settings,S.fn); S.presetName=p.name; rerenderPanel(); toast(`"${p.name}" hentet`); } return; }
  if (t.matches('select[name="sort"]')){ S.sort=t.value; refreshResults(); return; }
  if (t.matches('input[data-id]')){ const id=+t.dataset.id; t.checked?S.checked.add(id):S.checked.delete(id); updateCounts(t.closest('.grp')); return; }
  if (t.matches('input[data-grp]')){ const grp=t.closest('.grp'); const g=S.results.find(x=>x.k===t.dataset.grp); g.exp.forEach(x=> t.checked?S.checked.add(x.id):S.checked.delete(x.id)); grp.querySelectorAll('input[data-id]').forEach(i=>i.checked=t.checked); updateCounts(grp); return; }
}
function updateCounts(grp){
  const g=S.results.find(x=>x.k===grp.dataset.k); const n=g.exp.filter(x=>S.checked.has(x.id)).length;
  grp.querySelector('.cnt small').textContent = n+' valgt'; grp.querySelector('input[data-grp]').checked = n===g.exp.length;
  const sum=document.querySelector('.rhead .sum span'); const total=S.results.reduce((a,x)=>a+x.exp.length,0);
  if (sum) sum.textContent = `· ${nf(total)} eksemplarer, ${nf(S.checked.size)} valgt`;
  document.querySelectorAll('[data-act="print"],[data-act="csv"]').forEach(b=>b.disabled=!S.checked.size);
}
function onInput(e){
  const t=e.target;
  if (t.matches('.chips-filter')){ const q=norm(t.value); t.closest('.chipbox').querySelectorAll('.chip').forEach(c=>{ c.style.display = !q || norm(c.dataset.v).includes(q) ? '' : 'none'; }); }
}
